document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    // Per-page prep: substitute UUIDs, strip SRI/crossorigin (blob URLs from a
    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.
    function resourcesFor(id) {
      var map = {};
      var list = extResources[id] || [];
      for (var k = 0; k < list.length; k++) {
        if (blobUrls[list[k].uuid]) map[list[k].id] = blobUrls[list[k].uuid];
      }
      return map;
    }
    for (const id of pageIds) {
      let t = pages[id];
      for (const uuid of uuids) t = t.split(uuid).join(blobUrls[uuid]);
      t = t.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');
      // The click interceptor owns every anchor click (not a <base target>):
      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.
      // composedPath + getAttribute('target') handle SVG <a> and shadow-DOM
      // anchors, which closest()/IDL .target get wrong.
      var headContent = 'window.__resources = ' + JSON.stringify(resourcesFor(id)) + ';' +
        (pageIds.length > 1 ?

            'if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.defaultPrevented) return;' +
            'var a = null, p = e.composedPath ? e.composedPath() : [e.target];' +
            'for (var j = 0; j < p.length && !a; j++) {' +

              'if (tn === "A" || tn === "a" || tn === "AREA") a = n;' +
            '}' +
            'if (!a && e.target.closest) a = e.target.closest("a, area");' +
            'if (!a || a.hasAttribute("download")) return;' +
            'var tg = a.getAttribute("target");' +
            'if (tg && tg !== "_self") return;' +
            'var h = a.getAttribute("href") || a.getAttribute("xlink:href");' +
            'if (!h || /^javascript:/i.test(h)) return;' +
            'if (h.charAt(0) !== "#") {' +
              'if (!tg) { var b = document.querySelector("base[target]"); if (b && b.getAttribute("target") !== "_self") return; }' +
              'e.preventDefault();' +
              'if (/^(?:[a-z][a-z0-9+.-]*:|\\/\\/)/i.test(h)) parent.location.assign(h);' +
              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');
      // Defuse any script end-tag sequence in the content (resource ids, page
      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';
      // Inject after <head> so the DOCTYPE stays first; prepending the script
      // would push the parser into quirks mode. DOMParser always emits a <head>
      // (synthesizing one if the source HTML omitted it) but may carry
      // attributes through, so match the full opening tag.
      var headOpen = t.match(/<head[^>]*>/i);
      if (headOpen) {
        var hi = headOpen.index + headOpen[0].length;
        t = t.slice(0, hi) + headScript + t.slice(hi);
      }
      pages[id] = t;
    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM
      // before Babel before text/babel).
      var template = pages[entryId];
      const doc = new DOMParser().parseFromString(template, 'text/html');
      document.documentElement.replaceWith(doc.documentElement);
      const dead = Array.from(document.scripts);
      for (const old of dead) {
        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.
        if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }
        // Non-executable script types (text/babel, application/json, …) are
        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);
        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{"pages":{"Ficha Cadastral Locador.dc":"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"2fd501df-a9f6-4b56-b38d-40e52d1770d6\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n@font-face { font-family:\"Gotham\"; src:url(\"75d4a96c-afc1-4b22-be52-dae850b3ca10\") format(\"opentype\"); font-weight:400; font-display:swap; }\n@font-face { font-family:\"Gotham\"; src:url(\"5614bc10-9d75-4dd2-8460-154427275d01\") format(\"opentype\"); font-weight:500; font-display:swap; }\n@font-face { font-family:\"Gotham\"; src:url(\"cc8c8483-5242-4a9e-a516-f7ea0a1c4f2d\") format(\"opentype\"); font-weight:700; font-display:swap; }\n@font-face { font-family:\"Gotham\"; src:url(\"14711d13-92ff-48f9-9864-aed16400979d\") format(\"opentype\"); font-weight:800; font-display:swap; }\n@font-face { font-family:\"Gotham\"; src:url(\"28ca5350-93cc-49c3-bb01-ae94325887fc\") format(\"opentype\"); font-weight:900; font-display:swap; }\n* { box-sizing:border-box; }\nhtml,body { margin:0; padding:0; }\nbody { background:#E4EAF2; font-family:\"Gotham\",\"Montserrat\",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }\n@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }\ninput::placeholder, textarea::placeholder { color:#A9B2BE; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:760px; margin:0 auto; min-height:100vh; background:#fff; display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,39,73,.10);\">\n\n  <!-- BRAND BAR -->\n  <sc-if value=\"{{ notIntro }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position:sticky; top:0; z-index:8; background:#fff; border-bottom:1px solid #DDE3EB; padding:14px 22px; display:flex; align-items:center; gap:14px;\">\n    <img src=\"fb75a873-1df1-4c58-b689-4edb564fda78\" alt=\"REMAX Smart\" style=\"width:34px; height:34px; object-fit:contain;\">\n    <div style=\"flex:1; min-width:0;\">\n      <div style=\"font-size:15px; font-weight:800; color:#002749; letter-spacing:-.01em; line-height:1;\">REMAX Smart<\u002Fdiv>\n      <div style=\"font-size:11px; color:#6B7480; letter-spacing:.04em; margin-top:3px;\">Ficha Cadastral · Locador<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex; background:#EDF1F6; border-radius:999px; padding:3px;\">\n      <button onclick=\"{{ setEtapas }}\" style=\"{{ tabEtapasStyle }}\">Etapas<\u002Fbutton>\n      <button onclick=\"{{ setPagina }}\" style=\"{{ tabPaginaStyle }}\">Página única<\u002Fbutton>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- PROGRESS -->\n  <sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"padding:16px 22px 6px; background:#fff; position:sticky; top:63px; z-index:7; border-bottom:1px solid #EDF1F6;\">\n    <div style=\"display:flex; align-items:flex-start;\">\n      <sc-for list=\"{{ progressSteps }}\" as=\"st\" hint-placeholder-count=\"5\">\n        <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;\" onclick=\"{{ st.onClick }}\">\n          <div style=\"{{ st.circleStyle }}\">{{ st.mark }}<\u002Fdiv>\n          <div style=\"{{ st.labelStyle }}\">{{ st.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- MAIN -->\n  <div style=\"flex:1; padding:24px 22px 36px;\">\n\n    <!-- INTRO -->\n    <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"text-align:center; padding:34px 8px 12px; animation:fadeUp .4s ease;\">\n      <img src=\"fb75a873-1df1-4c58-b689-4edb564fda78\" alt=\"\" style=\"width:64px; height:64px; object-fit:contain; margin-bottom:18px;\">\n      <div style=\"font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:#DC1C2E; margin-bottom:10px;\">Cadastro de Locação<\u002Fdiv>\n      <h1 style=\"font-size:30px; font-weight:900; color:#002749; letter-spacing:-.02em; line-height:1.1; margin:0 0 12px;\">Ficha Cadastral do Locador<\u002Fh1>\n      <p style=\"font-size:15px; line-height:1.55; color:#404041; max-width:430px; margin:0 auto 26px;\">Preencha os dados do imóvel e do proprietário, anexe os documentos e nós organizamos tudo em uma pasta no Drive e enviamos ao broker.<\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:12px; max-width:420px; margin:0 auto 28px; text-align:left;\">\n        <div style=\"display:flex; gap:14px; align-items:center; background:#F5F7FA; border:1px solid #EDF1F6; border-radius:12px; padding:14px 16px;\">\n          <div style=\"width:30px; height:30px; flex:none; border-radius:999px; background:#003DA5; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px;\">1<\u002Fdiv>\n          <div><div style=\"font-weight:700; color:#002749; font-size:14px;\">Preencha a ficha<\u002Fdiv><div style=\"font-size:13px; color:#6B7480;\">Locador, imóvel, dados financeiros e administração<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:14px; align-items:center; background:#F5F7FA; border:1px solid #EDF1F6; border-radius:12px; padding:14px 16px;\">\n          <div style=\"width:30px; height:30px; flex:none; border-radius:999px; background:#003DA5; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px;\">2<\u002Fdiv>\n          <div><div style=\"font-weight:700; color:#002749; font-size:14px;\">Anexe os documentos<\u002Fdiv><div style=\"font-size:13px; color:#6B7480;\">RG e CPF, contas de consumo, IPTU e condomínio<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:14px; align-items:center; background:#F5F7FA; border:1px solid #EDF1F6; border-radius:12px; padding:14px 16px;\">\n          <div style=\"width:30px; height:30px; flex:none; border-radius:999px; background:#003DA5; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px;\">3<\u002Fdiv>\n          <div><div style=\"font-weight:700; color:#002749; font-size:14px;\">Envie ao broker<\u002Fdiv><div style=\"font-size:13px; color:#6B7480;\">PDF por e-mail + cópia no Drive (ano · mês · imóvel)<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"{{ start }}\" style=\"background:#003DA5; color:#fff; border:none; border-radius:10px; padding:15px 38px; font-family:Gotham,sans-serif; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(0,61,165,.28);\" style-hover=\"background:#002749;\">Começar →<\u002Fbutton>\n      <div style=\"margin-top:22px; font-size:12px; color:#A9B2BE;\">Protótipo para validação · a integração final com Drive e e-mail é a próxima etapa<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- FORM SECTIONS -->\n    <sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"animation:fadeUp .3s ease;\">\n      <sc-if value=\"{{ stepHasError }}\" hint-placeholder-val=\"\">\n      <div style=\"display:flex; align-items:center; gap:10px; background:#FDEBED; border:1px solid #F4C0C6; border-radius:10px; padding:12px 14px; margin-bottom:18px;\">\n        <div style=\"width:8px; height:8px; border-radius:999px; background:#DC1C2E; flex:none;\"><\u002Fdiv>\n        <div style=\"font-size:13px; font-weight:700; color:#9F1622;\">Preencha os itens obrigatórios desta etapa (ou marque “Não existe”) para continuar.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ sections }}\" as=\"sec\" hint-placeholder-count=\"1\">\n        <sc-if value=\"{{ sec.visible }}\" hint-placeholder-val=\"{{ true }}\">\n        <section style=\"margin-bottom:30px;\">\n          <div style=\"display:flex; align-items:center; gap:13px; margin:0 0 18px;\">\n            <div style=\"width:32px; height:32px; flex:none; border-radius:9px; background:#003DA5; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;\">{{ sec.num }}<\u002Fdiv>\n            <div>\n              <div style=\"font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:#DC1C2E; font-weight:700;\">{{ sec.eyebrow }}<\u002Fdiv>\n              <div style=\"font-size:19px; font-weight:700; color:#002749; line-height:1.1;\">{{ sec.title }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ sec.groups }}\" as=\"g\" hint-placeholder-count=\"1\">\n            <div>\n              <sc-if value=\"{{ g.subtitle }}\" hint-placeholder-val=\"\">\n              <div style=\"font-size:12px; font-weight:700; color:#0D7DC3; text-transform:uppercase; letter-spacing:.08em; margin:18px 0 12px; padding-top:14px; border-top:1px dashed #DDE3EB;\">{{ g.subtitle }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ g.rows }}\" as=\"row\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px;\">\n                  <sc-for list=\"{{ row }}\" as=\"f\" hint-placeholder-count=\"2\">\n                    <div style=\"flex:1 1 150px; min-width:0;\">\n                      <div style=\"display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;\">\n                        <div style=\"display:flex; align-items:center; gap:7px; min-width:0;\">\n                          <sc-if value=\"{{ f.required }}\" hint-placeholder-val=\"\">\n                            <div style=\"{{ f.dotStyle }}\"><\u002Fdiv>\n                          <\u002Fsc-if>\n                          <label style=\"font-size:11.5px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; color:#6B7480;\">{{ f.label }}<\u002Flabel>\n                        <\u002Fdiv>\n                        <sc-if value=\"{{ f.niAllowed }}\" hint-placeholder-val=\"\">\n                          <button onclick=\"{{ f.niToggle }}\" style=\"{{ f.niStyle }}\">{{ f.niLabel }}<\u002Fbutton>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n\n                      <sc-if value=\"{{ f.niOn }}\" hint-placeholder-val=\"\">\n                        <div style=\"width:100%; padding:12px 14px; font-family:Gotham,sans-serif; font-size:15px; color:#A9B2BE; background:#F5F7FA; border:1px dashed #DDE3EB; border-radius:8px; font-style:italic;\">Não existe / não se aplica<\u002Fdiv>\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ f.isPlainOn }}\" hint-placeholder-val=\"{{ true }}\">\n                        <input type=\"{{ f.inputType }}\" inputmode=\"{{ f.inputMode }}\" value=\"{{ f.value }}\" placeholder=\"{{ f.placeholder }}\" onchange=\"{{ f.onChange }}\" onblur=\"{{ f.onBlur }}\" style=\"width:100%; padding:12px 14px; font-family:Gotham,sans-serif; font-size:15px; color:#002749; background:#fff; border:1px solid #DDE3EB; border-radius:8px; outline:none;\" style-focus=\"border-color:#003DA5; box-shadow:0 0 0 3px rgba(0,61,165,.12);\">\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ f.isMoneyOn }}\" hint-placeholder-val=\"\">\n                        <div style=\"display:flex; align-items:center; background:#fff; border:1px solid #DDE3EB; border-radius:8px; overflow:hidden;\" style-focus-within=\"border-color:#003DA5; box-shadow:0 0 0 3px rgba(0,61,165,.12);\">\n                          <span style=\"padding:12px 0 12px 14px; color:#6B7480; font-size:15px; font-weight:500;\">R$<\u002Fspan>\n                          <input type=\"text\" inputmode=\"numeric\" value=\"{{ f.value }}\" placeholder=\"0,00\" onchange=\"{{ f.onChange }}\" style=\"flex:1; min-width:0; padding:12px 14px 12px 8px; font-family:Gotham,sans-serif; font-size:15px; color:#002749; background:transparent; border:none; outline:none;\">\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ f.isSelect }}\" hint-placeholder-val=\"\">\n                        <select value=\"{{ f.value }}\" onchange=\"{{ f.onChange }}\" style=\"width:100%; padding:12px 14px; font-family:Gotham,sans-serif; font-size:15px; color:#002749; background:#fff; border:1px solid #DDE3EB; border-radius:8px; outline:none; appearance:none; cursor:pointer;\" style-focus=\"border-color:#003DA5; box-shadow:0 0 0 3px rgba(0,61,165,.12);\">\n                          <sc-for list=\"{{ f.options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                            <option value=\"{{ opt.value }}\">{{ opt.label }}<\u002Foption>\n                          <\u002Fsc-for>\n                        <\u002Fselect>\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ f.isTextarea }}\" hint-placeholder-val=\"\">\n                        <textarea value=\"{{ f.value }}\" placeholder=\"{{ f.placeholder }}\" onchange=\"{{ f.onChange }}\" rows=\"4\" style=\"width:100%; padding:12px 14px; font-family:Gotham,sans-serif; font-size:15px; color:#002749; background:#fff; border:1px solid #DDE3EB; border-radius:8px; outline:none; resize:vertical;\" style-focus=\"border-color:#003DA5; box-shadow:0 0 0 3px rgba(0,61,165,.12);\"><\u002Ftextarea>\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ f.isRadio }}\" hint-placeholder-val=\"\">\n                        <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n                          <sc-for list=\"{{ f.options }}\" as=\"opt\" hint-placeholder-count=\"2\">\n                            <button onclick=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\">{{ opt.label }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n\n                      <sc-if value=\"{{ f.loading }}\" hint-placeholder-val=\"\">\n                        <div style=\"font-size:12px; color:#0D7DC3; margin-top:5px;\">Buscando endereço…<\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ f.error }}\" hint-placeholder-val=\"\">\n                        <div style=\"font-size:12px; color:#DC1C2E; margin-top:5px;\">{{ f.error }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ sec.toggle }}\" hint-placeholder-val=\"\">\n            <button onclick=\"{{ sec.toggle.onClick }}\" style=\"{{ sec.toggle.style }}\">{{ sec.toggle.label }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fsection>\n        <\u002Fsc-if>\n      <\u002Fsc-for>\n\n      <!-- DOCS -->\n      <sc-if value=\"{{ docsVisible }}\" hint-placeholder-val=\"\">\n      <section style=\"margin-bottom:24px;\">\n        <div style=\"display:flex; align-items:center; gap:13px; margin:0 0 18px;\">\n          <div style=\"width:32px; height:32px; flex:none; border-radius:9px; background:#003DA5; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;\">5<\u002Fdiv>\n          <div>\n            <div style=\"font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:#DC1C2E; font-weight:700;\">Etapa 5 de 5<\u002Fdiv>\n            <div style=\"font-size:19px; font-weight:700; color:#002749; line-height:1.1;\">Documentos<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ docRows }}\" as=\"d\" hint-placeholder-count=\"3\">\n          <div style=\"border:1px solid #DDE3EB; border-radius:12px; padding:16px; margin-bottom:14px;\">\n            <div style=\"display:flex; align-items:flex-start; gap:12px;\">\n              <div style=\"flex:1; min-width:0;\">\n                <div style=\"display:flex; align-items:center; gap:8px;\">\n                  <sc-if value=\"{{ d.required }}\" hint-placeholder-val=\"\">\n                    <div style=\"{{ d.dotStyle }}\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"font-weight:700; color:#002749; font-size:15px;\">{{ d.title }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:13px; color:#6B7480; margin-top:2px;\">{{ d.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ d.canUpload }}\" hint-placeholder-val=\"{{ true }}\">\n                <label for=\"{{ d.inputId }}\" style=\"flex:none; background:#fff; color:#003DA5; border:1.5px solid #003DA5; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;\" style-hover=\"background:#F5F7FA;\">+ Anexar<\u002Flabel>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ d.niAllowed }}\" hint-placeholder-val=\"\">\n                <button onclick=\"{{ d.niToggle }}\" style=\"{{ d.niStyle }}\">{{ d.niLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <input id=\"{{ d.inputId }}\" type=\"file\" multiple=\"\" onchange=\"{{ d.onPick }}\" style=\"display:none;\">\n            <\u002Fdiv>\n            <sc-if value=\"{{ d.niOn }}\" hint-placeholder-val=\"\">\n              <div style=\"margin-top:12px; padding:10px 12px; background:#F5F7FA; border:1px dashed #DDE3EB; border-radius:8px; font-size:13px; color:#A9B2BE; font-style:italic;\">Marcado como “não existe” para este imóvel<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ d.error }}\" hint-placeholder-val=\"\">\n              <div style=\"font-size:12px; color:#DC1C2E; margin-top:10px;\">{{ d.error }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ d.hasFiles }}\" hint-placeholder-val=\"\">\n            <div style=\"display:flex; flex-direction:column; gap:8px; margin-top:14px;\">\n              <sc-for list=\"{{ d.files }}\" as=\"fl\" hint-placeholder-count=\"0\">\n                <div style=\"display:flex; align-items:center; gap:10px; background:#F5F7FA; border:1px solid #EDF1F6; border-radius:8px; padding:8px 10px;\">\n                  <sc-if value=\"{{ fl.isImg }}\" hint-placeholder-val=\"\">\n                    <div style=\"width:38px; height:38px; flex:none; border-radius:6px; background:#003DA5; color:#fff; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700;\">IMG<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ fl.notImg }}\" hint-placeholder-val=\"\">\n                    <div style=\"width:38px; height:38px; flex:none; border-radius:6px; background:#A4D7F4; color:#002749; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;\">PDF<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"flex:1; min-width:0;\">\n                    <div style=\"font-size:13px; font-weight:500; color:#002749; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ fl.name }}<\u002Fdiv>\n                    <div style=\"font-size:11px; color:#6B7480;\">{{ fl.size }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <button onclick=\"{{ fl.onRemove }}\" style=\"flex:none; background:transparent; border:none; color:#DC1C2E; font-size:18px; cursor:pointer; padding:4px 8px; line-height:1;\">×<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- REVIEW -->\n    <sc-if value=\"{{ isReview }}\" hint-placeholder-val=\"\">\n    <div style=\"animation:fadeUp .3s ease;\">\n      <div style=\"font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:#DC1C2E; font-weight:700; margin-bottom:6px;\">Revisão final<\u002Fdiv>\n      <h2 style=\"font-size:24px; font-weight:800; color:#002749; margin:0 0 4px; letter-spacing:-.01em;\">Confira antes de enviar<\u002Fh2>\n      <p style=\"font-size:14px; color:#6B7480; margin:0 0 22px;\">Tudo certo? Vamos enviar o PDF por e-mail ao broker e salvar uma cópia da documentação no Drive.<\u002Fp>\n\n      <sc-if value=\"{{ hasMissing }}\" hint-placeholder-val=\"\">\n      <div style=\"background:#FDEBED; border:1px solid #F4C0C6; border-radius:12px; padding:16px 18px; margin-bottom:22px;\">\n        <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:10px;\">\n          <div style=\"width:8px; height:8px; border-radius:999px; background:#DC1C2E; flex:none;\"><\u002Fdiv>\n          <div style=\"font-size:13.5px; font-weight:700; color:#9F1622;\">Faltam itens obrigatórios para enviar<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n          <sc-for list=\"{{ missingItems }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <span style=\"font-size:12.5px; font-weight:500; color:#9F1622; background:#fff; border:1px solid #F4C0C6; border-radius:999px; padding:5px 12px;\">{{ m.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex; align-items:center; gap:12px; background:#F5F7FA; border:1px solid #EDF1F6; border-radius:12px; padding:14px 16px; margin-bottom:22px;\">\n        <span style=\"font-size:18px;\">✉️<\u002Fspan>\n        <div style=\"flex:1; min-width:0;\">\n          <div style=\"font-size:11px; font-weight:700; color:#6B7480; text-transform:uppercase; letter-spacing:.08em;\">PDF será enviado para<\u002Fdiv>\n          <div style=\"font-size:14px; font-weight:700; color:#002749; word-break:break-all;\">{{ brokerEmail }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- PDF card -->\n      <div style=\"display:flex; align-items:center; gap:14px; background:#002749; border-radius:12px; padding:16px 18px; margin-bottom:22px;\">\n        <div style=\"width:42px; height:52px; flex:none; border-radius:6px; background:#fff; display:flex; align-items:center; justify-content:center; color:#DC1C2E; font-size:11px; font-weight:800;\">PDF<\u002Fdiv>\n        <div style=\"flex:1; min-width:0;\">\n          <div style=\"color:#fff; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ pdfName }}<\u002Fdiv>\n          <div style=\"color:#A4D7F4; font-size:12px; margin-top:2px;\">Ficha preenchida · gerada automaticamente<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ reviewSections }}\" as=\"rs\" hint-placeholder-count=\"2\">\n        <div style=\"border:1px solid #DDE3EB; border-radius:12px; padding:16px 18px; margin-bottom:14px;\">\n          <div style=\"font-size:13px; font-weight:700; color:#003DA5; text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px;\">{{ rs.title }}<\u002Fdiv>\n          <sc-for list=\"{{ rs.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex; gap:14px; padding:6px 0; border-bottom:1px solid #F5F7FA;\">\n              <div style=\"flex:0 0 42%; font-size:13px; color:#6B7480;\">{{ it.label }}<\u002Fdiv>\n              <div style=\"flex:1; font-size:13px; color:#002749; font-weight:500; text-align:right; word-break:break-word;\">{{ it.value }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <!-- Drive tree -->\n      <div style=\"border:1px solid #DDE3EB; border-radius:12px; padding:16px 18px; margin-bottom:8px;\">\n        <div style=\"font-size:13px; font-weight:700; color:#003DA5; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;\">Como será organizado no Drive<\u002Fdiv>\n        <a href=\"{{ driveUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block; font-size:12.5px; color:#0D7DC3; text-decoration:none; margin-bottom:14px; word-break:break-all;\" style-hover=\"text-decoration:underline;\">📁 Pasta compartilhada do Drive →<\u002Fa>\n        <sc-for list=\"{{ driveTree }}\" as=\"node\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex; align-items:center; gap:9px; padding:4px 0; font-size:13.5px; color:#002749;\">\n            <div style=\"{{ node.indentStyle }}\"><\u002Fdiv>\n            <span style=\"font-size:15px;\">{{ node.icon }}<\u002Fspan>\n            <span style=\"{{ node.textStyle }}\">{{ node.name }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- SENT -->\n    <sc-if value=\"{{ isSent }}\" hint-placeholder-val=\"\">\n    <div style=\"text-align:center; padding:30px 6px; animation:fadeUp .4s ease;\">\n      <div style=\"width:70px; height:70px; border-radius:999px; background:#1F8A5B; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:34px;\">✓<\u002Fdiv>\n      <h2 style=\"font-size:26px; font-weight:900; color:#002749; margin:0 0 8px; letter-spacing:-.01em;\">Enviado ao broker!<\u002Fh2>\n      <p style=\"font-size:15px; color:#404041; max-width:420px; margin:0 auto 24px; line-height:1.5;\">A ficha em PDF e os documentos foram organizados na pasta do Drive e encaminhados para validação.<\u002Fp>\n\n      <div style=\"text-align:left; border:1px solid #DDE3EB; border-radius:12px; padding:16px 18px; max-width:480px; margin:0 auto 16px;\">\n        <div style=\"font-size:11px; font-weight:700; color:#6B7480; text-transform:uppercase; letter-spacing:.1em; margin-bottom:12px;\">Pasta criada no Drive<\u002Fdiv>\n        <sc-for list=\"{{ driveTree }}\" as=\"node\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex; align-items:center; gap:9px; padding:4px 0; font-size:13.5px; color:#002749;\">\n            <div style=\"{{ node.indentStyle }}\"><\u002Fdiv>\n            <span style=\"font-size:15px;\">{{ node.icon }}<\u002Fspan>\n            <span style=\"{{ node.textStyle }}\">{{ node.name }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:inline-flex; align-items:center; gap:10px; background:#F5F7FA; border:1px solid #EDF1F6; border-radius:999px; padding:8px 16px; margin-bottom:28px;\">\n        <span style=\"font-size:15px;\">✉️<\u002Fspan>\n        <span style=\"font-size:13px; color:#404041;\">Enviado para <strong style=\"color:#002749;\">{{ brokerEmail }}<\u002Fstrong><\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; gap:10px; justify-content:center; flex-wrap:wrap;\">\n        <a href=\"{{ driveUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none; background:#003DA5; color:#fff; border-radius:10px; padding:14px 26px; font-family:Gotham,sans-serif; font-size:15px; font-weight:700; display:inline-flex; align-items:center; gap:8px;\" style-hover=\"background:#002749;\">📁 Abrir pasta no Drive<\u002Fa>\n        <button onclick=\"{{ reset }}\" style=\"background:#fff; color:#003DA5; border:1.5px solid #003DA5; border-radius:10px; padding:14px 26px; font-family:Gotham,sans-serif; font-size:15px; font-weight:700; cursor:pointer;\" style-hover=\"background:#F5F7FA;\">Nova ficha<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <!-- ACTION BAR -->\n  <sc-if value=\"{{ showActionBar }}\" hint-placeholder-val=\"\">\n  <div style=\"position:sticky; bottom:0; z-index:8; background:#fff; border-top:1px solid #DDE3EB; padding:14px 22px; display:flex; gap:12px; align-items:center;\">\n    <sc-if value=\"{{ showBack }}\" hint-placeholder-val=\"\">\n      <button onclick=\"{{ back }}\" style=\"background:#fff; color:#404041; border:1.5px solid #DDE3EB; border-radius:10px; padding:13px 22px; font-family:Gotham,sans-serif; font-size:15px; font-weight:700; cursor:pointer;\" style-hover=\"background:#F5F7FA;\">← Voltar<\u002Fbutton>\n    <\u002Fsc-if>\n    <div style=\"flex:1;\"><\u002Fdiv>\n    <button onclick=\"{{ primaryAction }}\" style=\"{{ primaryStyle }}\">{{ primaryLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:900},&quot;brokerEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;marcelogutierres@remax.com.br&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;driveRoot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Documentação — Locação&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;driveUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://drive.google.com/drive/folders/1MZ-ZQV6arDOsF6_sHE68ksfMwcpeAj2V?usp=drive_link&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;etapas&quot;,&quot;pagina&quot;],&quot;default&quot;:&quot;etapas&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const keys = this.fieldKeys();\n    const values = {};\n    keys.forEach(k => values[k] = '');\n    values['adm_taxa'] = '8%';\n    this.state = {\n      screen: 'intro',\n      mode: (props && props.defaultMode) || 'etapas',\n      step: 1,\n      has2Locador: false,\n      has2Titular: false,\n      values,\n      errors: {},\n      cepLoading: {},\n      naoExiste: {},\n      docNI: {},\n      triedSteps: {},\n      files: this.emptyFiles(),\n    };\n  }\n\n  docKeys() { return ['rgcpf','energia','agua','gas','iptu','condominio']; }\n  docLabel(k) { return {rgcpf:'RG e CPF', energia:'Conta de energia', agua:'Conta de água', gas:'Conta de gás', iptu:'Documento do IPTU', condominio:'Documento do condomínio'}[k] || k; }\n  docNIAllowed(k) { return ['gas','iptu','agua','condominio'].includes(k); }\n  docRequired(k) { return ['rgcpf','energia','agua','condominio'].includes(k); }\n  emptyFiles() { const f={}; this.docKeys().forEach(k=>f[k]=[]); return f; }\n\n  fieldKeys() {\n    const loc = ['nome','rg','cpf','nasc','cep','endereco','numero','complemento','bairro','cidade','estado','profissao','civil','email','celular','fixo'];\n    const conj = ['conj_nome','conj_rg','conj_cpf','conj_nasc','conj_profissao','conj_civil_regime'];\n    const k = [];\n    loc.forEach(s => { k.push('loc1_'+s); k.push('loc2_'+s); });\n    conj.forEach(s => { k.push('loc1_'+s); k.push('loc2_'+s); });\n    ['tipo','ref','cep','endereco','numero','complemento','bairro','cidade','estado','condominio','iptu','valorcond','enel','sabesp','comgas','admcond','admcontato','inicio','contribuinte','anuncio','proposta'].forEach(s => k.push('im_'+s));\n    ['banco','agencia','conta','favorecido','pix'].forEach(s => { k.push('fin1_'+s); k.push('fin2_'+s); });\n    k.push('adm_resp','adm_taxa','repasse','outras');\n    return k;\n  }\n\n  // ---- masks ----\n  onlyDigits(v){ return (''+v).replace(/\\D/g,''); }\n  maskCPF(v){ let d=this.onlyDigits(v).slice(0,11); if(d.length>9) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`; if(d.length>6) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`; if(d.length>3) return `${d.slice(0,3)}.${d.slice(3)}`; return d; }\n  maskCEP(v){ let d=this.onlyDigits(v).slice(0,8); return d.length>5 ? `${d.slice(0,5)}-${d.slice(5)}` : d; }\n  maskPhone(v){ let d=this.onlyDigits(v).slice(0,11); if(!d) return ''; if(d.length<3) return `(${d}`; const ddd=d.slice(0,2), r=d.slice(2); if(r.length<=4) return `(${ddd}) ${r}`; if(d.length<=10) return `(${ddd}) ${r.slice(0,4)}-${r.slice(4)}`; return `(${ddd}) ${r.slice(0,5)}-${r.slice(5)}`; }\n  maskMoney(v){ let d=this.onlyDigits(v); if(!d) return ''; d=d.replace(/^0+/,'')||'0'; while(d.length<3) d='0'+d; const int=d.slice(0,-2), c=d.slice(-2); return `${int.replace(/\\B(?=(\\d{3})+(?!\\d))/g,'.')},${c}`; }\n  validaCPF(v){ const c=this.onlyDigits(v); if(c.length!==11||/^(\\d)\\1+$/.test(c)) return false; let s=0; for(let i=0;i<9;i++) s+=parseInt(c[i])*(10-i); let d1=11-(s%11); if(d1>=10)d1=0; if(d1!==parseInt(c[9])) return false; s=0; for(let i=0;i<10;i++) s+=parseInt(c[i])*(11-i); let d2=11-(s%11); if(d2>=10)d2=0; return d2===parseInt(c[10]); }\n\n  setVal(key, val, type) {\n    let v = val;\n    if (type==='cpf') v=this.maskCPF(val);\n    else if (type==='cep') v=this.maskCEP(val);\n    else if (type==='tel') v=this.maskPhone(val);\n    else if (type==='money') v=this.maskMoney(val);\n    this.setState(s => {\n      const errors = {...s.errors};\n      if (errors[key]) delete errors[key];\n      return { values: {...s.values, [key]: v}, errors };\n    });\n  }\n\n  toggleNI(key) {\n    this.setState(s => {\n      const ni = {...s.naoExiste};\n      const now = !ni[key];\n      const values = {...s.values};\n      const errors = {...s.errors};\n      if (now) { ni[key]=true; values[key]='Não existe'; if(errors[key]) delete errors[key]; }\n      else { delete ni[key]; values[key]=''; }\n      return { naoExiste: ni, values, errors };\n    });\n  }\n  toggleDocNI(key) {\n    this.setState(s => {\n      const d = {...s.docNI};\n      if (d[key]) delete d[key]; else d[key]=true;\n      return { docNI: d };\n    });\n  }\n\n  checkCPF(key) {\n    const v = this.state.values[key];\n    if (v && !this.validaCPF(v)) this.setState(s=>({errors:{...s.errors,[key]:'CPF inválido'}}));\n  }\n\n  async lookupCEP(key, prefix) {\n    const cep = this.onlyDigits(this.state.values[key]);\n    if (cep.length !== 8) return;\n    this.setState(s=>({cepLoading:{...s.cepLoading,[key]:true}}));\n    try {\n      const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);\n      const d = await r.json();\n      if (!d.erro) {\n        this.setState(s=>({values:{...s.values,\n          [prefix+'endereco']: d.logradouro || s.values[prefix+'endereco'],\n          [prefix+'bairro']: d.bairro || s.values[prefix+'bairro'],\n          [prefix+'cidade']: d.localidade || s.values[prefix+'cidade'],\n          [prefix+'estado']: d.uf || s.values[prefix+'estado'],\n        }}));\n      }\n    } catch(e) {}\n    this.setState(s=>({cepLoading:{...s.cepLoading,[key]:false}}));\n  }\n\n  // ---- file uploads ----\n  fmtSize(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }\n  onPick(key, e) {\n    const list = [...e.target.files];\n    if (!list.length) return;\n    const mapped = list.map(file => ({ name:file.name, size:this.fmtSize(file.size), isImg:file.type.startsWith('image/'), notImg:!file.type.startsWith('image/'), thumb:file.type.startsWith('image/')?URL.createObjectURL(file):null }));\n    this.setState(s=>({files:{...s.files,[key]:[...s.files[key],...mapped]}}));\n    e.target.value='';\n  }\n  removeFile(key, i){ this.setState(s=>({files:{...s.files,[key]:s.files[key].filter((_,idx)=>idx!==i)}})); }\n\n  // ---- navigation ----\n  go(screen){ this.setState({screen}); window.scrollTo(0,0); }\n  start(){ this.setState({screen:'form', step:1}); }\n  goStep(n){ if(this.state.screen==='form') this.setState({step:n}); }\n  missingInStep(step) {\n    const miss = [];\n    this.buildSections().forEach(sec => {\n      if (sec.step !== step) return;\n      sec.groups.forEach(g => g.rows.forEach(row => row.forEach(f => {\n        if (f.required && !f.filled) miss.push(f.label);\n      })));\n    });\n    if (step === 5) {\n      this.docKeys().forEach(k => {\n        if (this.docRequired(k) && !this.state.docNI[k] && this.state.files[k].length===0) miss.push(this.docLabel(k));\n      });\n    }\n    return miss;\n  }\n  next(){\n    const s=this.state.step;\n    const miss = this.missingInStep(s);\n    if (miss.length) {\n      this.setState(st=>({triedSteps:{...st.triedSteps,[s]:true}}));\n      window.scrollTo(0,0);\n      return;\n    }\n    if(s<5) this.setState({step:s+1}); else this.go('review');\n    window.scrollTo(0,0);\n  }\n  back(){ if(this.state.screen==='review'){ this.go('form'); return; } const s=this.state.step; if(s>1) this.setState({step:s-1}); else this.go('intro'); }\n  reset(){ const keys=this.fieldKeys(); const values={}; keys.forEach(k=>values[k]=''); values['adm_taxa']='8%'; this.setState({screen:'intro', step:1, has2Locador:false, has2Titular:false, values, errors:{}, naoExiste:{}, docNI:{}, triedSteps:{}, files:this.emptyFiles()}); }\n\n  // ---- field builder ----\n  bf(key, label, type, opts) {\n    opts = opts || {};\n    const V = this.state.values, E = this.state.errors;\n    const isSelect=type==='select', isTextarea=type==='textarea', isRadio=type==='radio', isMoney=type==='money';\n    const isPlain = !isSelect && !isTextarea && !isRadio && !isMoney;\n    const niAllowed = !!opts.ni;\n    const niOn = niAllowed && !!this.state.naoExiste[key];\n    const required = !!opts.req;\n    const filled = niOn || !!((V[key]!=null) && (''+V[key]).trim());\n    const dotBase = {width:'8px',height:'8px',flex:'none',borderRadius:'999px',transition:'background .2s'};\n    const niBase = {flex:'none',border:'1.5px solid',borderRadius:'999px',padding:'4px 10px',fontFamily:'Gotham,sans-serif',fontSize:'11px',fontWeight:700,cursor:'pointer',letterSpacing:'.02em'};\n    const f = {\n      key, label, value: V[key]||'', error: E[key]||'',\n      isSelect, isTextarea, isRadio, isMoney, isPlain,\n      niAllowed, niOn,\n      required, filled,\n      dotStyle: {...dotBase, background: filled ? '#1F8A5B' : '#DC1C2E'},\n      isPlainOn: isPlain && !niOn,\n      isMoneyOn: isMoney && !niOn,\n      niLabel: niOn ? '✓ Não existe' : 'Não existe',\n      niStyle: niOn ? {...niBase, background:'#003DA5', color:'#fff', borderColor:'#003DA5'} : {...niBase, background:'#fff', color:'#6B7480', borderColor:'#DDE3EB'},\n      niToggle: ()=>this.toggleNI(key),\n      inputType: type==='email'?'email':(type==='date'?'date':'text'),\n      inputMode: (type==='tel'||type==='cpf'||type==='cep')?'numeric':'text',\n      placeholder: opts.ph||'', options: [], loading:false,\n      onChange: e => this.setVal(key, e.target.value, type),\n      onBlur: undefined,\n    };\n    if (isSelect) {\n      f.options = [{value:'',label:opts.ph||'Selecione'}].concat((opts.options||[]).map(o=>({value:o,label:o})));\n    }\n    if (isRadio) {\n      const base = {padding:'10px 16px',borderRadius:'999px',border:'1.5px solid',fontFamily:'Gotham,sans-serif',fontSize:'13.5px',fontWeight:700,cursor:'pointer'};\n      f.options = (opts.options||[]).map(o => {\n        const sel = V[key]===o;\n        return { label:o, onClick:()=>this.setVal(key,o,'text'),\n          style: sel ? {...base,background:'#003DA5',color:'#fff',borderColor:'#003DA5'} : {...base,background:'#fff',color:'#404041',borderColor:'#DDE3EB'} };\n      });\n    }\n    if (type==='cep') { f.onBlur=()=>this.lookupCEP(key, opts.fill); f.loading=!!this.state.cepLoading[key]; }\n    if (type==='cpf') f.onBlur=()=>this.checkCPF(key);\n    f._type = type; f._money = isMoney;\n    return f;\n  }\n\n  locadorGroup(p) {\n    const civil=['Solteiro(a)','Casado(a)','Divorciado(a)','Viúvo(a)','União estável'];\n    const UF=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];\n    return [\n      [ this.bf(p+'nome','Nome completo','text',{req:true}) ],\n      [ this.bf(p+'rg','RG','text',{req:true}), this.bf(p+'cpf','CPF','cpf',{ph:'000.000.000-00', req:true}), this.bf(p+'nasc','Nascimento','date',{req:true}) ],\n      [ this.bf(p+'cep','CEP','cep',{ph:'00000-000', fill:p, req:true}), this.bf(p+'endereco','Endereço','text',{req:true}) ],\n      [ this.bf(p+'numero','Número','text',{req:true}), this.bf(p+'complemento','Complemento','text'), this.bf(p+'bairro','Bairro','text',{req:true}) ],\n      [ this.bf(p+'cidade','Cidade','text',{req:true}), this.bf(p+'estado','Estado','select',{options:UF, req:true}) ],\n      [ this.bf(p+'profissao','Profissão','text',{req:true}), this.bf(p+'civil','Estado civil','select',{options:civil, req:true}) ],\n      [ this.bf(p+'email','E-mail','email',{req:true}) ],\n      [ this.bf(p+'celular','Celular','tel',{ph:'(00) 00000-0000', req:true}), this.bf(p+'fixo','Telefone fixo','tel',{ph:'(00) 0000-0000'}) ],\n    ];\n  }\n\n  conjugeGroup(p) {\n    const regimes=['Comunhão parcial de bens','Comunhão universal de bens','Separação total de bens','Participação final nos aquestos'];\n    return [\n      [ this.bf(p+'conj_nome','Nome do cônjuge','text',{req:true}) ],\n      [ this.bf(p+'conj_rg','RG','text',{req:true}), this.bf(p+'conj_cpf','CPF','cpf',{ph:'000.000.000-00', req:true}), this.bf(p+'conj_nasc','Nascimento','date',{req:true}) ],\n      [ this.bf(p+'conj_profissao','Profissão','text',{req:true}), this.bf(p+'conj_civil_regime','Regime de bens','select',{options:regimes, req:true}) ],\n    ];\n  }\n\n  isCasado(p) { const v=this.state.values[p+'civil']; return v==='Casado(a)' || v==='União estável'; }\n\n  finGroup(p) {\n    return [\n      [ this.bf(p+'banco','Banco','text',{req:true}), this.bf(p+'agencia','Agência','text',{req:true}), this.bf(p+'conta','Conta corrente','text',{req:true}) ],\n      [ this.bf(p+'favorecido','Favorecido','text',{req:true}) ],\n      [ this.bf(p+'pix','Chave PIX','text') ],\n    ];\n  }\n\n  buildSections() {\n    const UF=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];\n    const tgl = (label, on)=>({label, onClick:on, style:{marginTop:'4px',background:'#fff',color:'#003DA5',border:'1.5px dashed #A4D7F4',borderRadius:'10px',padding:'12px 18px',fontFamily:'Gotham,sans-serif',fontSize:'14px',fontWeight:700,cursor:'pointer',width:'100%'}});\n\n    // Locadores\n    const locGroups = [{rows:this.locadorGroup('loc1_')}];\n    if (this.isCasado('loc1_')) locGroups.push({subtitle:'Cônjuge do 1º locador', rows:this.conjugeGroup('loc1_')});\n    if (this.state.has2Locador) {\n      locGroups.push({subtitle:'2º Locador', rows:this.locadorGroup('loc2_')});\n      if (this.isCasado('loc2_')) locGroups.push({subtitle:'Cônjuge do 2º locador', rows:this.conjugeGroup('loc2_')});\n    }\n    const locSec = { num:1, eyebrow:'Etapa 1 de 5', title: this.state.has2Locador?'Locadores':'Locador', step:1, groups:locGroups,\n      toggle: this.state.has2Locador ? tgl('— Remover 2º locador', ()=>this.setState({has2Locador:false})) : tgl('+ Adicionar 2º locador', ()=>this.setState({has2Locador:true})) };\n\n    // Imóvel\n    const imSec = { num:2, eyebrow:'Etapa 2 de 5', title:'Imóvel', step:2, groups:[{rows:[\n      [ this.bf('im_tipo','Tipo de imóvel','select',{options:['Apartamento','Casa','Cobertura','Studio','Sala comercial','Terreno','Outro'], req:true}), this.bf('im_ref','Referência no site','text') ],\n      [ this.bf('im_cep','CEP','cep',{ph:'00000-000', fill:'im_', req:true}), this.bf('im_endereco','Endereço','text',{req:true}) ],\n      [ this.bf('im_numero','Número','text',{req:true}), this.bf('im_complemento','Complemento','text'), this.bf('im_bairro','Bairro','text',{req:true}) ],\n      [ this.bf('im_cidade','Cidade','text',{req:true}), this.bf('im_estado','Estado','select',{options:UF, req:true}) ],\n      [ this.bf('im_condominio','Nome do condomínio','text',{ni:true, req:true}), this.bf('im_admcond','Adm. condominial','text',{ni:true, req:true}) ],\n      [ this.bf('im_admcontato','Contato da Adm. do condomínio','text',{ph:'Telefone ou e-mail', ni:true, req:true}) ],\n      [ this.bf('im_iptu','Valor IPTU','money',{ni:true, req:true}), this.bf('im_valorcond','Valor condomínio','money',{ni:true, req:true}) ],\n      [ this.bf('im_enel','Instalação ENEL','text',{ni:true, req:true}), this.bf('im_sabesp','Instalação Sabesp','text',{ni:true, req:true}), this.bf('im_comgas','Instalação Comgás','text',{ni:true, req:true}) ],\n      [ this.bf('im_contribuinte','Contribuinte IPTU','text',{ni:true, req:true}), this.bf('im_inicio','Início do contrato','date',{req:true}) ],\n      [ this.bf('im_anuncio','Valor do anúncio','money',{req:true}), this.bf('im_proposta','Valor proposta','money',{req:true}) ],\n    ]}] };\n\n    // Financeiro\n    const finGroups = [{subtitle:'1ª Titular', rows:this.finGroup('fin1_')}];\n    if (this.state.has2Titular) finGroups.push({subtitle:'2ª Titular', rows:this.finGroup('fin2_')});\n    const finSec = { num:3, eyebrow:'Etapa 3 de 5', title:'Informações financeiras', step:3, groups:finGroups,\n      toggle: this.state.has2Titular ? tgl('— Remover 2ª titular', ()=>this.setState({has2Titular:false})) : tgl('+ Adicionar 2ª titular', ()=>this.setState({has2Titular:true})) };\n\n    // Administração + Outras\n    const admSec = { num:4, eyebrow:'Etapa 4 de 5', title:'Administração', step:4, groups:[{rows:[\n      [ this.bf('adm_resp','REMAX administra o imóvel?','radio',{options:['Sim','Não'], req:true}) ],\n      [ this.bf('adm_taxa','Taxa negociada','text',{ph:'ex: 8%'}) ],\n      [ this.bf('repasse','Repasse','radio',{options:['Somente aluguel','Aluguel + condomínio + IPTU'], req:true}) ],\n      [ this.bf('outras','Outras informações (tudo que foi combinado na locação)','textarea',{ph:'Anote acordos, prazos, condições especiais…'}) ],\n    ]}] };\n\n    return [locSec, imSec, finSec, admSec];\n  }\n\n  missingRequired() {\n    const miss = [];\n    this.buildSections().forEach(sec => sec.groups.forEach(g => g.rows.forEach(row => row.forEach(f => {\n      if (f.required && !f.filled) miss.push(f.label);\n    }))));\n    this.docKeys().forEach(k => {\n      if (this.docRequired(k) && !this.state.docNI[k] && this.state.files[k].length===0) miss.push(this.docLabel(k));\n    });\n    return miss;\n  }\n\n  buildReview(sections) {\n    const out = [];\n    sections.forEach(sec => {\n      const items = [];\n      sec.groups.forEach(g => g.rows.forEach(row => row.forEach(f => {\n        const v = this.state.values[f.key];\n        if (v && (''+v).trim()) items.push({ label:f.label, value: (f._money && v!=='Não existe') ? ('R$ '+v) : v });\n      })));\n      if (items.length) out.push({ title: sec.title, items });\n    });\n    // docs\n    const docItems = [];\n    this.docKeys().forEach(k => {\n      if (this.state.docNI[k]) { docItems.push({label:this.docLabel(k), value:'Não existe'}); return; }\n      this.state.files[k].forEach(f => docItems.push({label:this.docLabel(k), value:f.name}));\n    });\n    if (docItems.length) out.push({ title:'Documentos', items: docItems });\n    return out;\n  }\n\n  pdfName() {\n    const V = this.state.values;\n    const nome = (V.loc1_nome||'Locador').trim().split(' ')[0];\n    return `Ficha_Cadastral_${nome}.pdf`;\n  }\n  folderName() {\n    const V = this.state.values;\n    const end = V.im_endereco ? (V.im_endereco + (V.im_numero?(', '+V.im_numero):'')) : 'Imóvel sem endereço';\n    const nome = (V.loc1_nome||'Locador').trim();\n    return `${end} — ${nome}`;\n  }\n  ymFolders() {\n    const d=new Date();\n    const ano=''+d.getFullYear();\n    const data=String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();\n    return { ano, data };\n  }\n  driveTree() {\n    const root = (this.props && this.props.driveRoot) || 'Documentação — Locação';\n    const ind = n => ({width:(n*18)+'px', flex:'none'});\n    const bold = {fontWeight:700};\n    const norm = {};\n    const { ano, data } = this.ymFolders();\n    const t = [\n      { name: root, icon:'📁', indentStyle:ind(0), textStyle:bold },\n      { name: ano, icon:'📁', indentStyle:ind(1), textStyle:bold },\n      { name: data, icon:'📁', indentStyle:ind(2), textStyle:bold },\n      { name: this.folderName(), icon:'📁', indentStyle:ind(3), textStyle:bold },\n      { name: this.pdfName(), icon:'📄', indentStyle:ind(4), textStyle:norm },\n      { name: 'Documentos', icon:'📁', indentStyle:ind(4), textStyle:bold },\n    ];\n    let any=false;\n    this.docKeys().forEach(k => {\n      if (this.state.docNI[k]) { any=true; t.push({ name: `${this.docLabel(k)} — não existe`, icon:'·', indentStyle:ind(5), textStyle:{fontStyle:'italic', color:'#A9B2BE'} }); return; }\n      this.state.files[k].forEach(f => {\n        any=true;\n        t.push({ name: `${this.docLabel(k)} — ${f.name}`, icon:'📄', indentStyle:ind(5), textStyle:norm });\n      });\n    });\n    if (!any) {\n      t.push({ name:'(nenhum documento anexado ainda)', icon:'·', indentStyle:ind(5), textStyle:{fontStyle:'italic', color:'#A9B2BE'} });\n    }\n    return t;\n  }\n\n  renderVals() {\n    const s = this.state;\n    const isIntro = s.screen==='intro', isForm = s.screen==='form', isReview = s.screen==='review', isSent = s.screen==='sent';\n    const isEtapas = s.mode==='etapas', isPagina = s.mode==='pagina';\n\n    const tried = (stp) => !!s.triedSteps[stp];\n    const sections = this.buildSections().map(sec => {\n      const showErr = tried(sec.step);\n      const groups = sec.groups.map(g => ({\n        ...g,\n        rows: g.rows.map(row => row.map(f => {\n          if (showErr && f.required && !f.filled && !f.error) {\n            return { ...f, error: f.niAllowed ? 'Preencha este item ou marque \"Não existe\"' : 'Item obrigatório — preencha para continuar' };\n          }\n          return f;\n        })),\n      }));\n      return { ...sec, groups, visible: isForm && (isPagina || s.step===sec.step) };\n    });\n\n    // docs rows\n    const docMeta = [\n      {key:'rgcpf', title:'RG e CPF', desc:'Documento de identidade dos locadores (frente e verso)', inputId:'up-rgcpf'},\n      {key:'energia', title:'Conta de energia', desc:'Última fatura (ENEL)', inputId:'up-energia'},\n      {key:'agua', title:'Conta de água', desc:'Última fatura (Sabesp)', inputId:'up-agua'},\n      {key:'gas', title:'Conta de gás', desc:'Última fatura (Comgás)', inputId:'up-gas'},\n      {key:'iptu', title:'Documento do IPTU', desc:'Carnê ou capa do IPTU do imóvel', inputId:'up-iptu'},\n      {key:'condominio', title:'Documento do condomínio', desc:'Boleto atualizado', inputId:'up-condominio'},\n    ];\n    const niBtn = {flex:'none',border:'1.5px solid',borderRadius:'999px',padding:'4px 10px',fontFamily:'Gotham,sans-serif',fontSize:'11px',fontWeight:700,cursor:'pointer',letterSpacing:'.02em'};\n    const docRows = docMeta.map(d => {\n      const niOn = !!s.docNI[d.key];\n      const niAllowed = this.docNIAllowed(d.key);\n      const required = this.docRequired(d.key);\n      const filled = niOn || s.files[d.key].length>0;\n      return {\n        ...d,\n        files: s.files[d.key].map((f,i)=>({...f, onRemove:()=>this.removeFile(d.key,i)})),\n        hasFiles: s.files[d.key].length>0 && !niOn,\n        canUpload: !niOn,\n        niAllowed, niOn,\n        required, filled,\n        error: (tried(5) && required && !filled) ? 'Anexe o documento ou marque \"Não existe\"' : '',\n        dotStyle: {width:'8px',height:'8px',flex:'none',borderRadius:'999px',background: filled ? '#1F8A5B' : '#DC1C2E',transition:'background .2s'},\n        niLabel: niOn ? '✓ Não existe' : 'Não existe',\n        niStyle: niOn ? {...niBtn, background:'#003DA5', color:'#fff', borderColor:'#003DA5'} : {...niBtn, background:'#fff', color:'#6B7480', borderColor:'#DDE3EB'},\n        niToggle: ()=>this.toggleDocNI(d.key),\n        onPick: e=>this.onPick(d.key, e),\n      };\n    });\n\n    // progress\n    const labels = ['Locadores','Imóvel','Financeiro','Admin.','Documentos'];\n    const cBase = {width:'30px',height:'30px',borderRadius:'999px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'13px',fontWeight:700,transition:'all .2s'};\n    const progressSteps = labels.map((label,i) => {\n      const n=i+1;\n      const done = isReview || isSent || (isForm && s.step>n);\n      const active = isForm && s.step===n;\n      let circleStyle, labelStyle;\n      if (active) circleStyle={...cBase,background:'#003DA5',color:'#fff',boxShadow:'0 0 0 4px rgba(0,61,165,.15)'};\n      else if (done) circleStyle={...cBase,background:'#A4D7F4',color:'#002749'};\n      else circleStyle={...cBase,background:'#EDF1F6',color:'#A9B2BE'};\n      labelStyle={fontSize:'10px',fontWeight:active?700:500,color:active?'#002749':'#A9B2BE',textAlign:'center',lineHeight:1.1};\n      return { n, label, mark: done&&!active ? '✓' : (''+n), circleStyle, labelStyle, onClick:()=>this.goStep(n) };\n    });\n\n    // tabs\n    const tBase = {border:'none',borderRadius:'999px',padding:'7px 14px',fontFamily:'Gotham,sans-serif',fontSize:'12.5px',fontWeight:700,cursor:'pointer'};\n    const tabEtapasStyle = isEtapas ? {...tBase,background:'#003DA5',color:'#fff'} : {...tBase,background:'transparent',color:'#6B7480'};\n    const tabPaginaStyle = isPagina ? {...tBase,background:'#003DA5',color:'#fff'} : {...tBase,background:'transparent',color:'#6B7480'};\n\n    // action bar\n    const showActionBar = isForm || isReview;\n    const showBack = (isForm && !(isPagina && s.step===1)) || isReview;\n    const pBase = {color:'#fff',background:'#003DA5',border:'none',borderRadius:'10px',padding:'13px 30px',fontFamily:'Gotham,sans-serif',fontSize:'15px',fontWeight:700,cursor:'pointer',boxShadow:'0 4px 14px rgba(0,61,165,.25)'};\n    const pDisabled = {...pBase,background:'#C4C6C8',color:'#fff',cursor:'not-allowed',boxShadow:'none'};\n    const missing = this.missingRequired();\n    const canSend = missing.length===0;\n    let primaryLabel, primaryAction, primaryStyle=pBase;\n    if (isReview) {\n      primaryLabel = canSend ? 'Enviar ao broker →' : 'Preencha os obrigatórios';\n      primaryAction = canSend ? (()=>this.go('sent')) : (()=>{});\n      primaryStyle = canSend ? pBase : pDisabled;\n    }\n    else if (isPagina) { primaryLabel='Revisar e enviar →'; primaryAction=()=>this.go('review'); }\n    else if (s.step===5) { primaryLabel='Revisar →'; primaryAction=()=>this.next(); }\n    else { primaryLabel='Continuar →'; primaryAction=()=>this.next(); }\n\n    const reviewSections = (isReview) ? this.buildReview(this.buildSections()) : [];\n\n    return {\n      isIntro, isForm, isReview, isSent, notIntro: !isIntro,\n      isEtapas, isPagina,\n      showProgress: isForm && isEtapas,\n      sections, docRows, docsVisible: isForm && (isPagina || s.step===5),\n      progressSteps, tabEtapasStyle, tabPaginaStyle,\n      stepHasError: isForm && isEtapas && s.triedSteps[s.step] && this.missingInStep(s.step).length>0,\n      stepErrorCount: (isForm && s.triedSteps[s.step]) ? this.missingInStep(s.step).length : 0,\n      showActionBar, showBack, primaryLabel, primaryAction, primaryStyle,\n      missingItems: missing.map((m,i)=>({label:m, key:'m'+i})), hasMissing: isReview && missing.length>0,\n      reviewSections, driveTree: (isReview||isSent) ? this.driveTree() : [],\n      pdfName: this.pdfName(), brokerEmail: (this.props && this.props.brokerEmail) || 'marcelogutierres@remax.com.br',\n      driveUrl: (this.props && this.props.driveUrl) || 'https://drive.google.com/drive/folders/1MZ-ZQV6arDOsF6_sHE68ksfMwcpeAj2V?usp=drive_link',\n      start: ()=>this.start(), next: ()=>this.next(), back: ()=>this.back(), reset: ()=>this.reset(),\n      goStep: n=>this.goStep(n),\n      setEtapas: ()=>this.setState({mode:'etapas'}), setPagina: ()=>this.setState({mode:'pagina'}),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"Ficha Cadastral Locador.dc"}
