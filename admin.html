<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Hub Admin</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">RE/MAX</span>
        <span class="brand-sub">SMART HUB · ADMIN</span>
      </div>
      <div class="topbar-right">
        <button id="btnVoltar" class="topbar-btn">← Voltar ao Hub</button>
      </div>
    </header>

    <main class="container admin-container">
      <section class="admin-section">
        <div class="admin-section-head">
          <h2>Credenciais dos Sistemas</h2>
          <p class="admin-sub">Senhas usadas pelo autologin. Só admin vê/edita.</p>
        </div>
        <div id="listaCredenciais" class="admin-grid"></div>
      </section>

      <section class="admin-section">
        <div class="admin-section-head">
          <h2>Usuários do Hub</h2>
          <button id="btnNovoUsuario" class="topbar-btn primario">+ Novo usuário</button>
        </div>
        <div id="listaUsuarios" class="admin-table"></div>
      </section>
    </main>

    <!-- Modal: editar credencial -->
    <dialog id="modalCred" class="modal">
      <form method="dialog" id="formCred" class="modal-form">
        <h3 id="modalCredTitulo">Editar credencial</h3>
        <input type="hidden" id="credSiteKey">
        <label class="auth-label">
          Login
          <input id="credLogin" type="text" autocomplete="off">
        </label>
        <label class="auth-label">
          Senha
          <input id="credPassword" type="text" autocomplete="off">
        </label>
        <div class="modal-actions">
          <button type="button" id="cancelarCred" class="topbar-btn">Cancelar</button>
          <button type="submit" class="topbar-btn primario">Salvar</button>
        </div>
      </form>
    </dialog>

    <!-- Modal: novo usuário -->
    <dialog id="modalUser" class="modal">
      <form method="dialog" id="formUser" class="modal-form">
        <h3>Criar usuário</h3>
        <label class="auth-label">
          Email
          <input id="userEmail" type="email" required>
        </label>
        <label class="auth-label">
          Senha inicial
          <input id="userSenha" type="text" required minlength="6">
        </label>
        <label class="auth-label-inline">
          <input id="userAdmin" type="checkbox">
          Tornar admin
        </label>
        <div class="modal-actions">
          <button type="button" id="cancelarUser" class="topbar-btn">Cancelar</button>
          <button type="submit" class="topbar-btn primario">Criar</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="admin-app.js"></script>
  </body>
</html>
