name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validar código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repo
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        # Pula o binário do Electron (~100 MB) — o lint não precisa dele.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Lint (ESLint)
        # Só erro derruba o build; aviso (ex.: código morto conhecido) passa.
        run: npm run lint

      - name: Verificar sintaxe do main process (Electron)
        run: node --check main.js

      - name: Verificar sintaxe do preload
        run: node --check preload.js

      - name: Verificar sintaxe das Cloud Functions
        run: node --check functions/index.js

      - name: Verificar sintaxe do renderer (módulos ES)
        run: |
          set -e
          # São módulos de browser (import de https://...). node --check trata .js como CJS
          # e quebraria no 'import'; então copiamos pra .mjs e checamos só a sintaxe.
          for f in hub-app.js admin-app.js auth-login.js; do
            echo "check $f"
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done
          echo "OK — sintaxe do renderer validada"

      - name: Validar package.json (raiz)
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Validar package.json (functions)
        run: node -e "JSON.parse(require('fs').readFileSync('functions/package.json','utf8'))"

      - name: Validar firebase.json
        run: node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"

      - name: Validar firestore.rules (existe?)
        run: |
          if [ -f firestore.rules ]; then
            echo "OK - regras do Firestore presentes"
          else
            echo "AVISO: firestore.rules ausente (ok, so aviso)"
          fi

      - name: Checar arquivos essenciais do renderer
        run: |
          set -e
          for f in index.html login.html admin.html hub-app.js admin-app.js auth-login.js firebase-config.js styles.css; do
            if [ ! -f "$f" ]; then
              echo "FALTA: $f"
              exit 1
            fi
          done
          echo "OK — todos os arquivos essenciais do renderer presentes"

      - name: Checar versão do package.json bate com tag do último release (informativo)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Versão declarada no package.json: $VERSION"
