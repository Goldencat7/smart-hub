<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Remax Smart Hub</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="hub-body">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="Imóveis RE/MAX Smart">
      </div>
      <div class="topbar-right">
        <span id="usuarioInfo" class="user-pill"></span>
        <button id="btnAdmin" class="topbar-btn" hidden>Admin</button>
        <button id="btnSair" class="topbar-btn">Sair</button>
      </div>
    </header>

    <div class="hub-layout">
      <!-- ──── Sidebar ──── -->
      <aside class="sidebar">
        <nav id="navCategorias" class="sidebar-nav">
          <!-- itens injetados via JS -->
        </nav>
      </aside>

      <!-- ──── Área central ──── -->
      <main class="hub-main">
        <div class="hub-main-head">
          <h2 id="tituloCategoria">Captação</h2>
          <div class="search-wrap">
            <input id="inputBusca" type="search" placeholder="Buscar nesta categoria..." autocomplete="off">
          </div>
        </div>

        <section id="appsGrid" class="hub-buttons-grid">
          <!-- cards injetados via JS -->
        </section>

        <div id="estadoVazio" class="estado-vazio" hidden>
          <p>Nenhum resultado.</p>
        </div>

        <!-- ──── Aba Documentos (placeholder) ──── -->
        <section id="secaoDocumentos" class="docs-placeholder" hidden>
          <div class="docs-card">
            <h3>📄 Documentos da empresa</h3>
            <p class="muted">
              Em breve: PDFs sincronizados com o Google Drive da Remax Smart.
              Aqui você vai poder consultar contratos modelo, manuais, fichas etc.
            </p>
            <span class="badge falta">Em desenvolvimento</span>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="hub-app.js"></script>
  </body>
</html>
