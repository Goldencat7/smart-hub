<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Remax Smart Hub</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="hub-body">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="Imóveis REMAX Smart">
        <span id="appVersion" class="brand-version"></span>
      </div>
      <div class="topbar-right">
        <img id="topAvatar" class="top-avatar" hidden alt="">
        <span id="usuarioInfo" class="user-pill"></span>
        <button id="btnAviso" class="topbar-btn" hidden><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>Enviar aviso</button>
        <button id="btnAdmin" class="topbar-btn" hidden>Admin</button>
        <button id="btnSair" class="topbar-btn">Sair</button>
      </div>
    </header>

    <div class="hub-layout">
      <!-- ──── Sidebar ──── -->
      <aside class="sidebar">
        <nav id="navCategorias" class="sidebar-nav">
          <!-- itens injetados via JS -->
        </nav>
      </aside>

      <!-- ──── Área central ──── -->
      <main class="hub-main">
        <div class="hub-main-head">
          <h2 id="tituloCategoria">Captação</h2>
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
            <input id="inputBusca" type="search" placeholder="Buscar nesta categoria..." autocomplete="off">
          </div>
        </div>

        <section id="appsGrid" class="hub-buttons-grid">
          <!-- cards injetados via JS -->
        </section>

        <div id="estadoVazio" class="estado-vazio" hidden>
          <p>Nenhum resultado.</p>
        </div>

        <!-- ──── Aba Marketing (templates editáveis) ──── -->
        <section id="secaoMarketing" class="mkt-wrap" hidden>
          <div class="mkt-grid">

            <div class="mkt-card" data-template="vendido.html">
              <div class="mkt-thumb">
                <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif">
                  <!-- fundo navy -->
                  <rect width="200" height="280" fill="#001f3f"/>
                  <!-- legenda topo -->
                  <text x="10" y="16" font-size="7" fill="rgba(255,255,255,0.4)">Imóvel vendido</text>
                  <!-- logo REMAX topo direito -->
                  <rect x="148" y="6" width="44" height="14" rx="2" fill="#DC1C2E"/>
                  <text x="170" y="16" text-anchor="middle" font-size="7.5" fill="white" font-weight="900" letter-spacing="1">REMAX</text>
                  <!-- banner VENDIDO -->
                  <rect x="22" y="28" width="156" height="46" rx="4" fill="#DC1C2E"/>
                  <text x="100" y="46" text-anchor="middle" font-size="9" fill="white" font-weight="700" letter-spacing="2">IMÓVEL</text>
                  <text x="100" y="66" text-anchor="middle" font-size="20" fill="white" font-weight="900" letter-spacing="1">VENDIDO</text>
                  <!-- área da foto -->
                  <rect x="12" y="84" width="176" height="108" fill="#0a1828"/>
                  <text x="100" y="144" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.15)">foto do imóvel</text>
                  <!-- linha separadora -->
                  <line x1="12" y1="200" x2="188" y2="200" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                  <!-- localização -->
                  <text x="100" y="218" text-anchor="middle" font-size="7" fill="rgba(255,255,255,0.55)" letter-spacing="1.5">BAIRRO · ZONA / CIDADE</text>
                  <!-- nome do corretor -->
                  <text x="12" y="248" font-size="22" fill="white" font-weight="900" letter-spacing="-0.5">NOME</text>
                  <!-- cargo e creci -->
                  <text x="12" y="264" font-size="7.5" fill="rgba(255,255,255,0.5)">Corretor · CRECI 00000-J</text>
                  <!-- telefone -->
                  <text x="12" y="276" font-size="7.5" fill="rgba(255,255,255,0.4)">(11) 99999-9999</text>
                </svg>
              </div>
              <div class="mkt-info">
                <span class="mkt-nome">Vendido</span>
                <span class="mkt-desc">Post para anúncio de imóvel vendido</span>
              </div>
              <button class="mkt-btn">Abrir editor ↗</button>
            </div>

          </div>
        </section>

        <!-- ──── Aba Documentos (Google Drive) ──── -->
        <section id="secaoDocumentos" class="docs-wrap" hidden>
          <div class="docs-painel">
            <div class="docs-painel-head">
              <span><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a1 1 0 0 1-.7-.3L10.9 4.3a1 1 0 0 0-.7-.3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>Documentos da empresa</span>
              <button id="btnAbrirDrive" class="topbar-btn">Abrir no Drive ↗</button>
            </div>
            <iframe id="driveFrame" class="drive-frame" title="Documentos da empresa"></iframe>
          </div>
        </section>

        <!-- ──── Aba Agenda (calendário completo) ──── -->
        <section id="secaoAgenda" class="agenda-full" hidden>
          <div class="cal-coluna">
            <div class="cal-head">
              <button id="calPrev" class="topbar-btn" title="Mês anterior">‹</button>
              <h3 id="calTitulo">—</h3>
              <button id="calProx" class="topbar-btn" title="Próximo mês">›</button>
              <button id="calHoje" class="topbar-btn">Hoje</button>
              <button id="calRecarregar" class="topbar-btn" title="Atualizar a agenda">↻ Atualizar</button>
              <button id="btnNovoEvento2" class="topbar-btn primario">+ Criar</button>
              <button id="btnGoogleAgenda" class="topbar-btn google-btn" title="Sincronizar com a Google Agenda"><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>Conectar Google</button>
            </div>
            <div id="calGrade" class="cal-grade"></div>
          </div>
          <div id="calDiaDetalhe" class="cal-dia-detalhe"></div>
        </section>

        <!-- ──── Aba Configurações ──── -->
        <section id="secaoConfig" class="config-wrap" hidden>
          <div class="config-card">
            <div class="config-avatar-area">
              <img id="cfgAvatar" class="config-avatar" alt="Foto de perfil">
              <div>
                <button type="button" id="cfgTrocarFoto" class="topbar-btn">Trocar foto</button>
                <button type="button" id="cfgRemoverFoto" class="topbar-btn perigo">Remover</button>
                <input id="cfgFileInput" type="file" accept="image/*" hidden>
                <p class="muted config-dica">PNG ou JPG. A imagem é reduzida automaticamente.</p>
              </div>
            </div>

            <label class="auth-label">
              Nome
              <input id="cfgNome" type="text" autocomplete="name" placeholder="Seu nome">
            </label>
            <label class="auth-label">
              Email
              <input id="cfgEmail" type="email" disabled>
            </label>

            <label class="auth-label-inline cfg-toggle">
              <input type="checkbox" id="cfgIniciarWindows"> Iniciar o Hub junto com o Windows
            </label>

            <div class="config-actions">
              <span id="cfgMsg" class="config-msg" hidden></span>
              <button type="button" id="cfgSalvar" class="topbar-btn primario">Salvar</button>
            </div>
          </div>
        </section>
      </main>

      <!-- ──── Painel lateral direito: relógio + mini calendário + próximos ──── -->
      <aside class="agenda-panel" id="agendaPanel">
        <button id="btnMinAgenda" class="agenda-min" title="Minimizar agenda">›</button>
        <div class="relogio">
          <div id="relogioHora" class="relogio-hora">--:--</div>
          <div id="relogioData" class="relogio-data">—</div>
        </div>
        <div id="miniCal" class="mini-cal"></div>
        <div class="agenda-prox">
          <div class="agenda-prox-head">
            <h4>Próximos</h4>
            <button id="btnNovoEvento" class="topbar-btn primario">+ Novo</button>
          </div>
          <div id="listaProx" class="lista-prox"></div>
        </div>
      </aside>
    </div>

    <!-- Botão pra reabrir a agenda quando minimizada -->
    <button id="btnExpandAgenda" class="agenda-expand" title="Mostrar agenda" hidden>‹</button>

    <!-- Modal: novo compromisso -->
    <dialog id="modalEvento" class="modal">
      <form method="dialog" id="formEvento" class="modal-form">
        <h3 id="modalEventoTitulo">Criar</h3>
        <div id="evTipoSel" class="ev-tipo-sel">
          <label class="ev-tipo-op"><input type="radio" name="evTipo" value="evento" checked><span><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>Evento</span></label>
          <label class="ev-tipo-op"><input type="radio" name="evTipo" value="tarefa"><span><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Tarefa</span></label>
          <label class="ev-tipo-op"><input type="radio" name="evTipo" value="lembrete"><span><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Lembrete</span></label>
        </div>
        <label class="auth-label">
          Título
          <input id="evTitulo" type="text" required maxlength="120" placeholder="Ex.: Reunião de equipe">
        </label>
        <div class="ev-datahora">
          <label class="auth-label">Data <input id="evData" type="date" required></label>
          <label class="auth-label">Hora <input id="evHora" type="time" required></label>
        </div>
        <label class="auth-label">
          Descrição (opcional)
          <input id="evDesc" type="text" maxlength="500">
        </label>
        <div id="evParticipantesArea" class="ev-participantes" hidden>
          <label class="auth-label-inline" id="evTodosLabel"><input type="checkbox" id="evTodos"> Marcar para <strong>todos</strong></label>
          <p class="muted" style="margin:6px 0 4px">Ou escolha quem participa:</p>
          <div id="evPessoas" class="ev-pessoas"></div>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelarEvento" class="topbar-btn">Cancelar</button>
          <button type="submit" class="topbar-btn primario">Salvar</button>
        </div>
      </form>
    </dialog>

    <!-- Popup: aviso recebido (só fecha clicando em "Vi") -->
    <dialog id="modalAviso" class="modal">
      <div class="modal-form aviso-recebido">
        <div class="aviso-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div>
        <h3 id="avisoTitulo">Aviso</h3>
        <p id="avisoMensagem" class="aviso-msg"></p>
        <div class="modal-actions">
          <button type="button" id="avisoCheck" class="topbar-btn primario"><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Vi</button>
        </div>
      </div>
    </dialog>

    <!-- Modal: admin envia um aviso -->
    <dialog id="modalEnviarAviso" class="modal">
      <form method="dialog" id="formEnviarAviso" class="modal-form">
        <h3><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>Enviar aviso</h3>
        <label class="auth-label">
          Título (opcional)
          <input id="avTitulo" type="text" maxlength="120" placeholder="Ex.: Reunião amanhã">
        </label>
        <label class="auth-label">
          Mensagem
          <textarea id="avMensagem" required maxlength="1000" rows="4" placeholder="Escreva o aviso..."></textarea>
        </label>
        <div class="ev-participantes">
          <label class="auth-label-inline"><input type="checkbox" id="avTodos"> Enviar para <strong>todos</strong></label>
          <p class="muted" style="margin:6px 0 4px">Ou escolha quem recebe:</p>
          <div id="avPessoas" class="ev-pessoas"></div>
        </div>
        <div class="modal-actions">
          <button type="button" id="avCancelar" class="topbar-btn">Cancelar</button>
          <button type="submit" class="topbar-btn primario">Enviar</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="hub-app.js"></script>
  </body>
</html>
