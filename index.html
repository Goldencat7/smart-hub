<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Remax Smart Hub</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="hub-body">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="Imóveis RE/MAX Smart">
      </div>
      <div class="topbar-right">
        <img id="topAvatar" class="top-avatar" hidden alt="">
        <span id="usuarioInfo" class="user-pill"></span>
        <button id="btnAdmin" class="topbar-btn" hidden>Admin</button>
        <button id="btnSair" class="topbar-btn">Sair</button>
      </div>
    </header>

    <div class="hub-layout">
      <!-- ──── Sidebar ──── -->
      <aside class="sidebar">
        <nav id="navCategorias" class="sidebar-nav">
          <!-- itens injetados via JS -->
        </nav>
      </aside>

      <!-- ──── Área central ──── -->
      <main class="hub-main">
        <div class="hub-main-head">
          <h2 id="tituloCategoria">Captação</h2>
          <div class="search-wrap">
            <input id="inputBusca" type="search" placeholder="Buscar nesta categoria..." autocomplete="off">
          </div>
        </div>

        <section id="appsGrid" class="hub-buttons-grid">
          <!-- cards injetados via JS -->
        </section>

        <div id="estadoVazio" class="estado-vazio" hidden>
          <p>Nenhum resultado.</p>
        </div>

        <!-- ──── Aba Documentos (Google Drive) ──── -->
        <section id="secaoDocumentos" class="docs-wrap" hidden>
          <div class="docs-painel">
            <div class="docs-painel-head">
              <span>📁 Documentos da empresa</span>
              <button id="btnAbrirDrive" class="topbar-btn">Abrir no Drive ↗</button>
            </div>
            <iframe id="driveFrame" class="drive-frame" title="Documentos da empresa"></iframe>
          </div>
        </section>

        <!-- ──── Aba Agenda (calendário completo) ──── -->
        <section id="secaoAgenda" class="agenda-full" hidden>
          <div class="cal-coluna">
            <div class="cal-head">
              <button id="calPrev" class="topbar-btn" title="Mês anterior">‹</button>
              <h3 id="calTitulo">—</h3>
              <button id="calProx" class="topbar-btn" title="Próximo mês">›</button>
              <button id="calHoje" class="topbar-btn">Hoje</button>
              <button id="btnNovoEvento2" class="topbar-btn primario">+ Novo compromisso</button>
            </div>
            <div id="calGrade" class="cal-grade"></div>
          </div>
          <div id="calDiaDetalhe" class="cal-dia-detalhe"></div>
        </section>

        <!-- ──── Aba Configurações ──── -->
        <section id="secaoConfig" class="config-wrap" hidden>
          <div class="config-card">
            <div class="config-avatar-area">
              <img id="cfgAvatar" class="config-avatar" alt="Foto de perfil">
              <div>
                <button type="button" id="cfgTrocarFoto" class="topbar-btn">Trocar foto</button>
                <button type="button" id="cfgRemoverFoto" class="topbar-btn perigo">Remover</button>
                <input id="cfgFileInput" type="file" accept="image/*" hidden>
                <p class="muted config-dica">PNG ou JPG. A imagem é reduzida automaticamente.</p>
              </div>
            </div>

            <label class="auth-label">
              Nome
              <input id="cfgNome" type="text" autocomplete="name" placeholder="Seu nome">
            </label>
            <label class="auth-label">
              Email
              <input id="cfgEmail" type="email" disabled>
            </label>

            <div class="config-actions">
              <span id="cfgMsg" class="config-msg" hidden></span>
              <button type="button" id="cfgSalvar" class="topbar-btn primario">Salvar</button>
            </div>
          </div>
        </section>
      </main>

      <!-- ──── Painel lateral direito: relógio + mini calendário + próximos ──── -->
      <aside class="agenda-panel" id="agendaPanel">
        <button id="btnMinAgenda" class="agenda-min" title="Minimizar agenda">›</button>
        <div class="relogio">
          <div id="relogioHora" class="relogio-hora">--:--</div>
          <div id="relogioData" class="relogio-data">—</div>
        </div>
        <div id="miniCal" class="mini-cal"></div>
        <div class="agenda-prox">
          <div class="agenda-prox-head">
            <h4>Próximos</h4>
            <button id="btnNovoEvento" class="topbar-btn primario">+ Novo</button>
          </div>
          <div id="listaProx" class="lista-prox"></div>
        </div>
      </aside>
    </div>

    <!-- Botão pra reabrir a agenda quando minimizada -->
    <button id="btnExpandAgenda" class="agenda-expand" title="Mostrar agenda" hidden>‹</button>

    <!-- Modal: novo compromisso -->
    <dialog id="modalEvento" class="modal">
      <form method="dialog" id="formEvento" class="modal-form">
        <h3 id="modalEventoTitulo">Novo compromisso</h3>
        <label class="auth-label">
          Título
          <input id="evTitulo" type="text" required maxlength="120" placeholder="Ex.: Reunião de equipe">
        </label>
        <div class="ev-datahora">
          <label class="auth-label">Data <input id="evData" type="date" required></label>
          <label class="auth-label">Hora <input id="evHora" type="time" required></label>
        </div>
        <label class="auth-label">
          Descrição (opcional)
          <input id="evDesc" type="text" maxlength="500">
        </label>
        <div id="evParticipantesArea" class="ev-participantes" hidden>
          <label class="auth-label-inline"><input type="checkbox" id="evTodos"> Marcar para <strong>todos</strong></label>
          <p class="muted" style="margin:6px 0 4px">Ou escolha quem participa:</p>
          <div id="evPessoas" class="ev-pessoas"></div>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelarEvento" class="topbar-btn">Cancelar</button>
          <button type="submit" class="topbar-btn primario">Salvar</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="hub-app.js"></script>
  </body>
</html>
