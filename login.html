<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Remax Smart Hub — Login</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <header class="auth-header">
        <img class="brand-logo" src="logo.png" alt="Imóveis REMAX Smart">
      </header>

      <!-- ──── View: Login ──── -->
      <div id="viewLogin">
        <h1 class="auth-title">Faça login</h1>
        <p class="auth-sub">Entre com sua conta do Hub.</p>

        <form id="formLogin" class="auth-form">
          <label class="auth-label">
            Email
            <input id="inputEmail" type="email" autocomplete="username" required>
          </label>
          <label class="auth-label">
            Senha
            <div class="senha-wrap">
              <input id="inputPass" type="password" autocomplete="current-password" required>
              <button type="button" class="olho-btn" id="btnVerSenha" aria-label="Mostrar senha" title="Mostrar senha">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </label>
          <button type="submit" class="auth-btn auth-btn-primary" id="btnEntrar">Entrar</button>
        </form>

        <p class="auth-toggle">
          Não tem conta? <a href="#" id="linkCriarConta">Criar conta</a>
          &nbsp;·&nbsp; <a href="#" id="linkEsqueceu">Esqueceu a senha?</a>
        </p>

        <p id="msgErro" class="auth-erro" hidden></p>
      </div>

      <!-- ──── View: Esqueceu a senha ──── -->
      <div id="viewEsqueceu" hidden>
        <h1 class="auth-title">Redefinir senha</h1>
        <p class="auth-sub">Digite seu email e enviaremos um link para redefinir a senha.</p>

        <form id="formEsqueceu" class="auth-form">
          <label class="auth-label">
            Email
            <input id="resetEmail" type="email" autocomplete="email" required>
          </label>
          <button type="submit" class="auth-btn auth-btn-primary" id="btnReset">Enviar link</button>
        </form>

        <p class="auth-toggle">
          <a href="#" id="linkVoltarEsqueceu">← Voltar pro login</a>
        </p>

        <p id="msgErroReset" class="auth-erro" hidden></p>
        <p id="msgOkReset"   class="auth-ok"   hidden></p>
      </div>

      <!-- ──── View: Cadastro ──── -->
      <div id="viewCadastro" hidden>
        <h1 class="auth-title">Criar conta</h1>
        <p class="auth-sub">Use o código de convite que o admin te passou.</p>

        <form id="formCadastro" class="auth-form">
          <label class="auth-label">
            Nome
            <input id="cadNome" type="text" autocomplete="given-name" placeholder="Ex: João" required>
          </label>
          <label class="auth-label">
            Sobrenome
            <input id="cadSobrenome" type="text" autocomplete="family-name" placeholder="Ex: Silva" required>
          </label>
          <label class="auth-label">
            Email
            <input id="cadEmail" type="email" autocomplete="email" required>
          </label>
          <label class="auth-label">
            Senha (mín. 6)
            <span class="senha-wrap">
              <input id="cadSenha" type="password" autocomplete="new-password" minlength="6" required>
              <button type="button" class="olho-btn" id="olhoCadSenha" aria-label="Mostrar senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </span>
          </label>
          <label class="auth-label">
            Confirmar senha
            <input id="cadSenhaConfirma" type="password" autocomplete="new-password" minlength="6" required>
          </label>
          <label class="auth-label">
            Código de convite
            <input id="cadCodigo" type="text" placeholder="REMAX-XXXXXXXX" required>
          </label>
          <button type="submit" class="auth-btn auth-btn-primary" id="btnCriar">Criar conta</button>
        </form>

        <p class="auth-toggle">
          Já tem conta? <a href="#" id="linkVoltarLogin">Voltar pro login</a>
        </p>

        <p id="msgErroCad" class="auth-erro" hidden></p>
        <p id="msgOkCad" class="auth-ok" hidden></p>
      </div>
    </main>

    <script type="module" src="auth-login.js"></script>
  </body>
</html>
