<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha Fiança — REMAX Smart</title><link rel="stylesheet" href="ficha.css">  <script src="ficha-watchdog.js"></script>
</head>
<body>
<script type="module">
import * as FE from './ficha-comum.js';

function render(){
  // 1. Valores e Coberturas
  let h = FE.secao(1, 'Valores e Coberturas',
    FE.row(
      FE.campo({label:'Aluguel', key:'aluguel', money:true, ph:'R$ 0,00'}),
      FE.campo({label:'IPTU', key:'iptu', money:true, ph:'R$ 0,00', badge:'opc', ni:true, nta:true})
    ) +
    FE.row(
      FE.campo({label:'Água', key:'agua', money:true, ph:'R$ 0,00', badge:'opc', ni:true, nta:true}),
      FE.campo({label:'Luz', key:'luz', money:true, ph:'R$ 0,00', badge:'opc', ni:true, nta:true})
    ) +
    FE.campo({label:'Condomínio', key:'condominio', money:true, ph:'R$ 0,00', badge:'opc', ni:true, nta:true}) +
    FE.campoRadio({label:'Cobertura de Danos ao Imóvel?', key:'cob_danos', options:['Sim','Não']}) +
    FE.campoRadio({label:'Cobertura de Pintura Interna?', key:'cob_pint_int', options:['Sim','Não']}) +
    FE.campoRadio({label:'Cobertura de Pintura Externa?', key:'cob_pint_ext', options:['Sim','Não']}) +
    FE.campoRadio({label:'Cobertura de Multa Contratual?', key:'cob_multa', options:['Sim','Não']})
  );

  // 2. Vigência da Locação
  h += FE.secao(2, 'Vigência da Locação',
    FE.row(
      FE.campo({label:'Início', key:'vigencia_inicio', type:'date'}),
      FE.campo({label:'Fim', key:'vigencia_fim', type:'date'})
    )
  );

  return h;
}

FE.iniciarFicha({
  titulo: 'Ficha Fiança',
  tipo: 'fianca',
  docs: [],
  rigidos: ['aluguel'],
  msgRigidos: 'Preencha pelo menos o valor do aluguel.',
  intro: 'Preencha os valores, coberturas e a vigência para a cotação do seguro fiança.',
  render,
});
</script>
</body></html>
