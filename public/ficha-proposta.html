<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha Proposta — REMAX Smart</title><link rel="stylesheet" href="ficha.css">
<style>
.total-box{background:#002749;color:#fff;border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin:4px 0 4px}
.total-box span{font-size:13px;font-weight:600;color:#A4D7F4}
.total-box strong{font-size:20px;font-weight:800}
.sig-wrap{border:2px dashed #d1d5db;border-radius:10px;background:#fff;overflow:hidden}
#sigCanvas{width:100%;height:180px;display:block;touch-action:none;cursor:crosshair}
.sig-bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.sig-bar small{font-size:11px;color:#6b7280}
.btn-limpar-sig{background:none;border:1px solid #d1d5db;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;color:#374151;cursor:pointer}
.data-local{font-size:12px;color:#6b7280;margin-top:10px;text-align:center}
</style>
</head>
<body>
<script type="module">
import * as FE from './ficha-comum.js';

let sigDrawn = false;
let sigData = '';   // assinatura salva (modo corretor/edição)

function localData(){ const m=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro']; const d=new Date(); return `São Paulo, ${d.getDate()} de ${m[d.getMonth()]} de ${d.getFullYear()}`; }

function render(){
  let h = FE.secao(1, 'Proposta',
    FE.campo({label:'Nome do cliente',key:'nome'}) +
    FE.campo({label:'CPF',key:'cpf',cpf:true,ph:'000.000.000-00'}) +
    FE.campoTextarea({label:'Imóvel',key:'imovel',req:true,ph:'Endereço / identificação do imóvel'}) +
    FE.row(FE.campo({label:'Sinal',key:'sinal',money:true,ph:'R$ 0,00'}), FE.campo({label:'Entrada',key:'entrada',money:true,ph:'R$ 0,00'})) +
    FE.campo({label:'Saldo a pagar (financiamento ou escritura)',key:'saldo',money:true,ph:'R$ 0,00'}) +
    `<div class="total-box"><span>Total da proposta</span><strong id="propTotal">R$ 0,00</strong></div>` +
    FE.campoTextarea({label:'Observações',key:'obs',ph:'Anote tudo que foi combinado na negociação…'})
  );
  const ro = FE.ehSomenteLeitura();
  h += FE.secao(2, 'Assinatura do cliente',
    `<div class="sig-wrap"><canvas id="sigCanvas"></canvas></div>
     <div class="sig-bar"><small>${ro?'Assinatura registrada pelo cliente.':'Assine no quadro acima com o dedo ou mouse.'}</small>${ro?'':`<button type="button" class="btn-limpar-sig" id="btnLimparSig">Limpar</button>`}</div>
     <div class="data-local">${localData()}</div>`
  );
  return h;
}

function total(){ return FE.moneyToNum(FE.v('sinal'))+FE.moneyToNum(FE.v('entrada'))+FE.moneyToNum(FE.v('saldo')); }

function wireCanvas(){
  const c=document.getElementById('sigCanvas'); if(!c||c._wired) return;
  const ro=FE.ehSomenteLeitura();
  const ratio=window.devicePixelRatio||1; const rect=c.getBoundingClientRect(); if(!rect.width) return;
  c.width=rect.width*ratio; c.height=rect.height*ratio;
  const ctx=c.getContext('2d'); ctx.scale(ratio,ratio); ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#002749';
  c._ctx=ctx; c._wired=true;
  // modo corretor/edição: desenha assinatura salva
  if(sigData){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height); img.src=sigData; sigDrawn=true; }
  if(ro) return;
  let drawing=false;
  const pos=e=>{ const r=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  const start=e=>{ e.preventDefault(); drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  const move=e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); sigDrawn=true; };
  const end=()=>{ drawing=false; };
  c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start,{passive:false}); c.addEventListener('touchmove',move,{passive:false}); c.addEventListener('touchend',end);
  const btn=document.getElementById('btnLimparSig');
  if(btn) btn.addEventListener('click',()=>{ const r=c.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); sigDrawn=false; });
}

FE.iniciarFicha({
  titulo:'Ficha Proposta', tipo:'proposta', docs:[],
  rigidos:['nome','cpf','imovel','sinal','entrada','saldo'],
  msgRigidos:'Preencha nome, CPF, imóvel e os valores (sinal, entrada e saldo).',
  intro:'Preencha os dados da proposta e assine no quadro ao final.',
  render,
  aoRenderizar:()=>{ wireCanvas(); const t=document.getElementById('propTotal'); if(t) t.textContent='R$ '+FE.fmtMoney(total()); },
  aoAtualizar:()=>{ const t=document.getElementById('propTotal'); if(t) t.textContent='R$ '+FE.fmtMoney(total()); },
  validar:()=>{ if(!sigDrawn) return 'Assine no quadro antes de enviar a proposta.'; return null; },
  antesDeEnviar:()=> new Promise(res=>{
    const c=document.getElementById('sigCanvas');
    if(!c || !sigDrawn){ res(); return; }
    c.toBlob(b=>{ if(b) FE.arquivos['assinatura']=new File([b],'assinatura.png',{type:'image/png'}); res(); },'image/png');
  }),
  aoCarregar:(f)=>{ if(f.documentos && f.documentos.assinatura) sigData=f.documentos.assinatura; },
});
</script>
</body></html>
