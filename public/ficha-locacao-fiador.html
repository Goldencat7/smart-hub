<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha Cadastral Locação com Fiador — REMAX Smart</title><link rel="stylesheet" href="ficha.css">  <script src="ficha-watchdog.js"></script>
</head>
<body>
<script type="module">
import * as FE from './ficha-comum.js';

const st = { has2Prop: false, numFiador: 1 };
const ordF = ['1º','2º'];

function render(){
  // 1. Locador(es)
  let prop = `<div class="sub-bloco" style="border:none;padding-top:0;margin-top:0"><div class="sub-bloco-titulo">👤 ${st.has2Prop?'1º Locador':'Locador'}</div>${FE.blocoPessoa('',{principal:true,renda:true})}</div>`;
  if(st.has2Prop){
    const rem=!FE.ehSomenteLeitura()?`<button type="button" class="btn-remover-bloco" data-action="remProp">✕ Remover</button>`:'';
    prop += `<div class="sub-bloco"><div class="sub-bloco-titulo">👤 Cônjuge / 2º Locador${rem}</div>${FE.blocoPessoa('p2_',{renda:true})}</div>`;
  }
  if(!FE.ehSomenteLeitura() && !st.has2Prop) prop+=`<button type="button" class="btn-add-bloco" data-action="addProp">+ Adicionar cônjuge ou 2º locador</button>`;
  let h = FE.secao(1, 'Locador(es)', prop);

  // 2. Imóvel de interesse
  h += FE.secao(2, 'Imóvel de interesse',
    FE.row(FE.campo({label:'Tipo de imóvel',key:'im_tipo',type:'select',optsHtml:FE.selOptions(FE.TIPOS,FE.v('im_tipo'))}), FE.campo({label:'Referência no site',key:'im_ref',badge:'opc'})) +
    FE.row(FE.campo({label:'CEP',key:'im_cep',cep:true,prefix:'im_',ph:'00000-000'}), FE.campo({label:'Endereço',key:'im_endereco',ph:'Rua, Avenida...'})) +
    FE.row(FE.campo({label:'Número',key:'im_numero'}), FE.campo({label:'Complemento',key:'im_complemento',badge:'opc'}), FE.campo({label:'Bairro',key:'im_bairro'})) +
    FE.row(FE.campo({label:'Cidade',key:'im_cidade'}), FE.campo({label:'Estado',key:'im_estado',type:'select',optsHtml:FE.ufOptions(FE.v('im_estado'))})) +
    FE.campo({label:'Nome do condomínio',key:'im_condominio',badge:'opc',ni:true,nta:true}) +
    FE.row(FE.campo({label:'Valor do anúncio',key:'im_anuncio',money:true,ph:'R$ 0,00'}), FE.campo({label:'Valor da proposta',key:'im_proposta',money:true,ph:'R$ 0,00'}))
  );

  // 3. Fiador(es) (1-2)
  let fia='';
  for(let i=1;i<=st.numFiador;i++){
    const P='f'+i+'_';
    const rem=(i>1&&!FE.ehSomenteLeitura())?`<button type="button" class="btn-remover-bloco" data-action="remFiador">✕ Remover</button>`:'';
    fia += `<div class="sub-bloco"${i===1?' style="border:none;padding-top:0;margin-top:0"':''}><div class="sub-bloco-titulo">👤 ${st.numFiador>1?ordF[i-1]+' Fiador':'Fiador'}${rem}</div>${FE.blocoPessoa(P,{renda:true})}</div>`;
  }
  if(!FE.ehSomenteLeitura() && st.numFiador<2) fia+=`<button type="button" class="btn-add-bloco" data-action="addFiador">+ Adicionar 2º fiador</button>`;
  h += FE.secao(3, 'Fiador(es)', fia);

  // 4. Imóvel garantia
  h += FE.secao(4, 'Imóvel garantia',
    FE.row(FE.campo({label:'Tipo de imóvel',key:'gar_tipo',type:'select',optsHtml:FE.selOptions(FE.TIPOS,FE.v('gar_tipo'))}), FE.campo({label:'Nº contribuinte IPTU',key:'gar_iptu',badge:'opc',ni:true,nta:true})) +
    FE.row(FE.campo({label:'CEP',key:'gar_cep',cep:true,prefix:'gar_',ph:'00000-000'}), FE.campo({label:'Endereço',key:'gar_endereco',ph:'Rua, Avenida...'})) +
    FE.row(FE.campo({label:'Número',key:'gar_numero'}), FE.campo({label:'Complemento',key:'gar_complemento',badge:'opc'}), FE.campo({label:'Bairro',key:'gar_bairro'})) +
    FE.row(FE.campo({label:'Cidade',key:'gar_cidade'}), FE.campo({label:'Estado',key:'gar_estado',type:'select',optsHtml:FE.ufOptions(FE.v('gar_estado'))})) +
    FE.campo({label:'Nome do condomínio',key:'gar_condominio',badge:'opc',ni:true,nta:true}) +
    FE.row(FE.campo({label:'Matrícula',key:'gar_matricula'}), FE.campo({label:'Cartório',key:'gar_cartorio',nta:true}))
  );
  return h;
}

FE.iniciarFicha({
  titulo:'Ficha Cadastral Locação com Fiador', tipo:'locacao_fiador', docsNum:5,
  rigidos:['nome','whatsapp','email'],
  msgRigidos:'Preencha pelo menos nome, WhatsApp e e-mail do 1º locador.',
  intro:'Preencha o(s) locador(es), imóvel de interesse, fiador(es) e o imóvel dado em garantia. Use <strong>"Não tenho agora"</strong> para pendências.',
  docs:[
    {key:'p_rgcpf',   icon:'🪪', label:'Locador — RG, CPF ou CNH',          badge:'obrig'},
    {key:'p_endereco',icon:'🏠', label:'Locador — Comp. de endereço',       badge:'obrig'},
    {key:'p_renda',   icon:'💰', label:'Locador — Comp. de renda (90 dias)',badge:'opc', nta:true},
    {key:'p_civil',   icon:'📋', label:'Locador — Estado civil',            badge:'opc', ni:true, nta:true},
    {key:'f_rgcpf',   icon:'🪪', label:'Fiador — RG, CPF ou CNH',              badge:'obrig'},
    {key:'f_endereco',icon:'🏠', label:'Fiador — Comp. de endereço',           badge:'obrig'},
    {key:'f_civil',   icon:'📋', label:'Fiador — Estado civil',                badge:'opc', ni:true, nta:true},
    {key:'g_iptu',    icon:'📄', label:'Garantia — Nº contribuinte IPTU',      badge:'opc', ni:true, nta:true},
    {key:'g_matricula',icon:'📋',label:'Garantia — Matrícula do imóvel',       badge:'obrig'},
  ],
  render,
  acoes:{
    addProp:()=>{ st.has2Prop=true; },
    remProp:()=>{ Object.keys(FE.valores).forEach(k=>{ if(k.startsWith('p2_')) delete FE.valores[k]; }); st.has2Prop=false; },
    addFiador:()=>{ if(st.numFiador<2) st.numFiador=2; },
    remFiador:()=>{ Object.keys(FE.valores).forEach(k=>{ if(k.startsWith('f2_')) delete FE.valores[k]; }); st.numFiador=1; },
  },
  aoCarregar:(f)=>{ const d=f.dados||{};
    if(Object.keys(d).some(k=>k.startsWith('p2_'))) st.has2Prop=true;
    if(Object.keys(d).some(k=>k.startsWith('f2_'))) st.numFiador=2;
  },
});
</script>
</body></html>
