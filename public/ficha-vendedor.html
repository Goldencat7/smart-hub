<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha Cadastral Vendedor — RE/MAX Smart</title><link rel="stylesheet" href="ficha.css"></head>
<body>
<script type="module">
import * as FE from './ficha-comum.js';

const st = { numVend: 1, numTit: 1 };
const ordV = ['1º','2º','3º','4º'];
const ordT = ['1ª','2ª','3ª','4ª'];

function finBlock(i){
  const P='fin'+i+'_';
  const rem=(i>1&&i===st.numTit&&!FE.ehSomenteLeitura())?`<button type="button" class="btn-remover-bloco" data-action="remTit">✕ Remover</button>`:'';
  const b=i===1?undefined:'opc';
  return `<div class="sub-bloco"${i===1?' style="border:none;padding-top:0;margin-top:0"':''}><div class="sub-bloco-titulo">💳 ${ordT[i-1]} Titular${rem}</div>
    ${FE.row(FE.campo({label:'Banco',key:P+'banco',badge:b}),FE.campo({label:'Agência',key:P+'agencia',badge:b}),FE.campo({label:'Conta corrente',key:P+'conta',badge:b}))}
    ${FE.campo({label:'Favorecido',key:P+'favorecido',badge:b})}
    ${FE.campo({label:'Chave PIX',key:P+'pix',badge:'opc'})}</div>`;
}

function render(){
  // 1. Vendedores (1-4) com cônjuge condicional
  let vend='';
  for(let i=1;i<=st.numVend;i++){
    const P=i===1?'':'loc'+i+'_';
    const rem=(i>1&&i===st.numVend&&!FE.ehSomenteLeitura())?`<button type="button" class="btn-remover-bloco" data-action="remVend">✕ Remover</button>`:'';
    vend += `<div class="sub-bloco"${i===1?' style="border:none;padding-top:0;margin-top:0"':''}><div class="sub-bloco-titulo">👤 ${st.numVend>1?ordV[i-1]+' Vendedor':'Vendedor'}${rem}</div>${FE.blocoPessoa(P,{principal:i===1})}${FE.ehCasado(P)?FE.subBloco('💍 Cônjuge do '+ordV[i-1]+' vendedor',FE.blocoConjuge(P)):''}</div>`;
  }
  if(!FE.ehSomenteLeitura() && st.numVend<4) vend+=`<button type="button" class="btn-add-bloco" data-action="addVend">+ Adicionar vendedor</button>`;
  let h = FE.secao(1, 'Vendedor(es)', vend);

  // 2. Imóvel
  h += FE.secao(2, 'Imóvel',
    FE.row(FE.campo({label:'Tipo de imóvel',key:'im_tipo',type:'select',optsHtml:FE.selOptions(FE.TIPOS,FE.v('im_tipo'))}), FE.campo({label:'Referência no site',key:'im_ref',badge:'opc'})) +
    FE.row(FE.campo({label:'CEP',key:'im_cep',cep:true,prefix:'im_',ph:'00000-000'}), FE.campo({label:'Endereço',key:'im_endereco',ph:'Rua, Avenida...'})) +
    FE.row(FE.campo({label:'Número',key:'im_numero'}), FE.campo({label:'Complemento',key:'im_complemento',badge:'opc'}), FE.campo({label:'Bairro',key:'im_bairro'})) +
    FE.row(FE.campo({label:'Cidade',key:'im_cidade'}), FE.campo({label:'Estado',key:'im_estado',type:'select',optsHtml:FE.ufOptions(FE.v('im_estado'))})) +
    FE.row(FE.campo({label:'Nome do condomínio',key:'im_condominio',badge:'opc',ni:true,nta:true}), FE.campo({label:'Adm. condominial',key:'im_admcond',badge:'opc',ni:true,nta:true})) +
    FE.row(FE.campo({label:'Valor IPTU',key:'im_iptu',money:true,badge:'opc',ni:true,nta:true,ph:'R$ 0,00'}), FE.campo({label:'Valor condomínio',key:'im_valorcond',money:true,badge:'opc',ni:true,nta:true,ph:'R$ 0,00'})) +
    FE.row(FE.campo({label:'Instalação ENEL',key:'im_enel',badge:'opc',ni:true,nta:true}), FE.campo({label:'Instalação Sabesp',key:'im_sabesp',badge:'opc',ni:true,nta:true})) +
    FE.row(FE.campo({label:'Instalação Comgás',key:'im_comgas',badge:'opc',ni:true,nta:true}), FE.campo({label:'Contribuinte IPTU',key:'im_contribuinte',badge:'opc',ni:true,nta:true})) +
    FE.row(FE.campo({label:'Valor do anúncio',key:'im_anuncio',money:true,ph:'R$ 0,00'}), FE.campo({label:'Valor da proposta',key:'im_proposta',money:true,ph:'R$ 0,00'})) +
    FE.row(FE.campo({label:'Valor da entrada',key:'im_entrada',money:true,badge:'opc',ni:true,nta:true,ph:'R$ 0,00'}), FE.campo({label:'Financiamento',key:'im_financiamento',money:true,badge:'opc',ni:true,nta:true,ph:'R$ 0,00'}), FE.campo({label:'FGTS',key:'im_fgts',money:true,badge:'opc',ni:true,nta:true,ph:'R$ 0,00'}))
  );

  // 3. Informações financeiras (1-4 titulares)
  let fin='';
  for(let i=1;i<=st.numTit;i++) fin+=finBlock(i);
  if(!FE.ehSomenteLeitura() && st.numTit<4) fin+=`<button type="button" class="btn-add-bloco" data-action="addTit">+ Adicionar titular</button>`;
  h += FE.secao(3, 'Informações financeiras', fin, ' <small style="font-weight:400;color:#6b7280;font-size:12px">(para recebimento)</small>');

  // 4. Comissões
  h += FE.secao(4, 'Comissões',
    FE.campo({label:'RE/MAX Smart — valor da comissão',key:'com_remax_valor',money:true,ph:'R$ 0,00'}) +
    FE.subBloco('🤝 Imobiliária parceira (se houver)',
      FE.row(FE.campo({label:'Imobiliária parceira',key:'com_parc_nome',badge:'opc',ni:true,nta:true}), FE.campo({label:'CNPJ',key:'com_parc_cnpj',cnpj:true,badge:'opc',ni:true,nta:true,ph:'00.000.000/0000-00'})) +
      FE.row(FE.campo({label:'Banco',key:'com_parc_banco',badge:'opc',ni:true,nta:true}), FE.campo({label:'Agência',key:'com_parc_agencia',badge:'opc',ni:true,nta:true}), FE.campo({label:'Conta',key:'com_parc_conta',badge:'opc',ni:true,nta:true})) +
      FE.campo({label:'Valor da comissão (parceira)',key:'com_parc_valor',money:true,badge:'opc',ni:true,nta:true,ph:'R$ 0,00'})
    ) +
    FE.campoTextarea({label:'Outras informações',key:'outras',ph:'Acordos, prazos, condições especiais…'})
  );
  return h;
}

FE.iniciarFicha({
  titulo:'Ficha Cadastral Vendedor', tipo:'vendedor', docsNum:5,
  rigidos:['nome','whatsapp','email'],
  msgRigidos:'Preencha pelo menos nome, WhatsApp e e-mail do 1º vendedor.',
  intro:'Preencha os dados do(s) vendedor(es), imóvel e comissões. Use <strong>"Não tenho agora"</strong> para pendências e <strong>"Não existe"</strong> para o que não se aplica.',
  docs:[
    {key:'rgcpf',     icon:'🪪', label:'RG e CPF',                badge:'obrig'},
    {key:'matricula', icon:'📋', label:'Matrícula / Escritura',   badge:'obrig'},
    {key:'iptu',      icon:'📄', label:'Documento do IPTU',       badge:'obrig'},
    {key:'energia',   icon:'⚡', label:'Conta de energia',        badge:'obrig'},
    {key:'condominio',icon:'🏢', label:'Documento do condomínio', badge:'opc', ni:true, nta:true},
    {key:'agua',      icon:'💧', label:'Conta de água',            badge:'opc', ni:true, nta:true},
    {key:'gas',       icon:'🔥', label:'Conta de gás',             badge:'opc', ni:true, nta:true},
  ],
  render,
  acoes:{
    addVend:()=>{ if(st.numVend<4) st.numVend++; },
    remVend:()=>{ const i=st.numVend; Object.keys(FE.valores).forEach(k=>{ if(k.startsWith('loc'+i+'_')) delete FE.valores[k]; }); st.numVend=Math.max(1,st.numVend-1); },
    addTit:()=>{ if(st.numTit<4) st.numTit++; },
    remTit:()=>{ const i=st.numTit; Object.keys(FE.valores).forEach(k=>{ if(k.startsWith('fin'+i+'_')) delete FE.valores[k]; }); st.numTit=Math.max(1,st.numTit-1); },
  },
  aoCarregar:(f)=>{ const d=f.dados||{};
    for(let i=4;i>=2;i--){ if(Object.keys(d).some(k=>k.startsWith('loc'+i+'_'))){ st.numVend=i; break; } }
    for(let i=4;i>=2;i--){ if(Object.keys(d).some(k=>k.startsWith('fin'+i+'_'))){ st.numTit=i; break; } }
  },
});
</script>
</body></html>
