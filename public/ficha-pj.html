<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha Cadastral (Pessoa Jurídica) — REMAX Smart</title><link rel="stylesheet" href="ficha.css">  <script src="ficha-watchdog.js"></script>
</head>
<body>
<script type="module">
import * as FE from './ficha-comum.js';

const st = { numSocios: 1 };
const ord = ['1º','2º','3º'];

function render(){
  // 1. Empresa
  let h = FE.secao(1, 'Empresa',
    FE.campo({label:'Razão social',key:'nome'}) +
    FE.row(FE.campo({label:'CNPJ',key:'cnpj',cnpj:true,ph:'00.000.000/0000-00'}), FE.campo({label:'Data de abertura',key:'abertura',type:'date'})) +
    FE.row(FE.campo({label:'CEP',key:'emp_cep',cep:true,prefix:'emp_',ph:'00000-000'}), FE.campo({label:'Endereço',key:'emp_endereco',ph:'Rua, Avenida...'})) +
    FE.row(FE.campo({label:'Número',key:'emp_numero'}), FE.campo({label:'Complemento',key:'emp_complemento',badge:'opc'}), FE.campo({label:'Bairro',key:'emp_bairro'})) +
    FE.row(FE.campo({label:'Cidade',key:'emp_cidade'}), FE.campo({label:'Estado',key:'emp_estado',type:'select',optsHtml:FE.ufOptions(FE.v('emp_estado'))})) +
    FE.campo({label:'Ramo de atividade',key:'ramo'}) +
    FE.row(FE.campo({label:'Faturamento atual',key:'faturamento',money:true,ph:'R$ 0,00'}), FE.campo({label:'Faturamento último ano',key:'faturamento_ano',money:true,ph:'R$ 0,00'})) +
    FE.campo({label:'E-mail',key:'email',type:'email'}) +
    FE.row(FE.campo({label:'Celular / WhatsApp',key:'whatsapp',type:'tel',ph:'(11) 90000-0000'}), FE.campo({label:'Telefone fixo',key:'emp_fixo',type:'tel',badge:'opc'}))
  );

  // 2. Sócios (1-3)
  let soc='';
  for(let i=1;i<=st.numSocios;i++){
    const P='s'+i+'_';
    const rem=(i>1&&i===st.numSocios&&!FE.ehSomenteLeitura())?`<button type="button" class="btn-remover-bloco" data-action="remSocio">✕ Remover</button>`:'';
    soc += `<div class="sub-bloco"${i===1?' style="border:none;padding-top:0;margin-top:0"':''}><div class="sub-bloco-titulo">👤 ${st.numSocios>1?ord[i-1]+' Sócio':'Sócio'}${rem}</div>${FE.blocoPessoa(P,{renda:true})}</div>`;
  }
  if(!FE.ehSomenteLeitura() && st.numSocios<3) soc+=`<button type="button" class="btn-add-bloco" data-action="addSocio">+ Adicionar sócio</button>`;
  h += FE.secao(2, 'Sócio(s)', soc);

  // 3. Imóvel de interesse
  h += FE.secao(3, 'Imóvel de interesse',
    FE.row(FE.campo({label:'Tipo de imóvel',key:'im_tipo',type:'select',optsHtml:FE.selOptions(FE.TIPOS,FE.v('im_tipo'))}), FE.campo({label:'Referência no site',key:'im_ref',badge:'opc'})) +
    FE.row(FE.campo({label:'CEP',key:'im_cep',cep:true,prefix:'im_',ph:'00000-000'}), FE.campo({label:'Endereço',key:'im_endereco',ph:'Rua, Avenida...'})) +
    FE.row(FE.campo({label:'Número',key:'im_numero'}), FE.campo({label:'Complemento',key:'im_complemento',badge:'opc'}), FE.campo({label:'Bairro',key:'im_bairro'})) +
    FE.row(FE.campo({label:'Cidade',key:'im_cidade'}), FE.campo({label:'Estado',key:'im_estado',type:'select',optsHtml:FE.ufOptions(FE.v('im_estado'))})) +
    FE.campo({label:'Nome do condomínio',key:'im_condominio',badge:'opc',ni:true,nta:true}) +
    FE.row(FE.campo({label:'Valor do anúncio',key:'im_anuncio',money:true,ph:'R$ 0,00'}), FE.campo({label:'Valor da proposta',key:'im_proposta',money:true,ph:'R$ 0,00'}))
  );
  return h;
}

FE.iniciarFicha({
  titulo:'Ficha Cadastral (Pessoa Jurídica)', tipo:'pj', docsNum:4,
  rigidos:['nome','cnpj','whatsapp','email'],
  msgRigidos:'Preencha pelo menos razão social, CNPJ, WhatsApp e e-mail da empresa.',
  intro:'Preencha os dados da empresa, sócios e imóvel. Use <strong>"Não tenho agora"</strong> para itens indisponíveis.',
  // Docs da empresa (uma vez) + um conjunto por SÓCIO (aparece conforme adiciona sócio).
  docs:()=>{
    const arr=[
      {heading:'🏢 Documentos da empresa'},
      {key:'cnpj_card', icon:'🏢', label:'Cartão CNPJ',                   badge:'obrig'},
      {key:'contrato',  icon:'📜', label:'Contrato social',                badge:'obrig'},
      {key:'emp_renda', icon:'💰', label:'Comprovante de renda (empresa)', badge:'obrig'},
    ];
    for(let i=1;i<=st.numSocios;i++){
      const nome=(FE.v('s'+i+'_nome')||'').trim();
      const tit=(st.numSocios>1?ord[i-1]+' Sócio':'Sócio')+(nome?' · '+nome:'');
      arr.push({heading:'👤 Documentos do '+tit});
      arr.push({key:'s'+i+'_rgcpf',    icon:'🪪', label:'RG, CPF ou CNH',              badge:'obrig'});
      arr.push({key:'s'+i+'_endereco', icon:'🏠', label:'Comprovante de endereço',     badge:'obrig'});
      arr.push({key:'s'+i+'_civil',    icon:'📋', label:'Comprovante de estado civil', badge:'opc', ni:true, nta:true});
    }
    return arr;
  },
  render,
  acoes:{
    addSocio:()=>{ if(st.numSocios<3) st.numSocios++; },
    remSocio:()=>{ const i=st.numSocios, pre='s'+i+'_'; Object.keys(FE.valores).forEach(k=>{ if(k.startsWith(pre)) delete FE.valores[k]; }); Object.keys(FE.arquivos).forEach(k=>{ if(k.startsWith(pre)) delete FE.arquivos[k]; }); [FE.pendentes,FE.naoExiste].forEach(set=>[...set].forEach(k=>{ if(k.startsWith(pre)) set.delete(k); })); st.numSocios=Math.max(1,st.numSocios-1); },
  },
  aoCarregar:(f)=>{ const d=f.dados||{}; if(Object.keys(d).some(k=>k.startsWith('s3_'))) st.numSocios=3; else if(Object.keys(d).some(k=>k.startsWith('s2_'))) st.numSocios=2; },
});
</script>
</body></html>
